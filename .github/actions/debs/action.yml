name: debs
description: >-
  Ubuntu packages a job needs that the runner image doesn't have, such as
  ffprobe and ffmpeg for the Music tests and Lua for the TV session's
  config. Ubuntu's mirror is sometimes slow enough that ffmpeg's 66 MB of
  packages outlast a job's 10 minutes before any test runs, so the packages
  are kept in GitHub's cache, keyed on exactly what apt would fetch. The
  push runs on agentv save it, and pull requests read it from there.

inputs:
  packages:
    description: "The packages, space-separated, like ffmpeg"
    required: true
  command:
    description: "A command that's there once they are, like ffprobe. When it's there already, nothing is installed"
    required: true
  name:
    description: "The cache's name for them, like ffmpeg (its key starts with <name>-debs-)"
    required: true

runs:
  using: composite
  steps:
    - name: What apt would fetch for ${{ inputs.name }}
      id: debs
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        COMMAND: ${{ inputs.command }}
        NAME: ${{ inputs.name }}
      run: |
        if type -P "$COMMAND" >/dev/null; then
          echo "need=false" >>"$GITHUB_OUTPUT"
          exit 0
        fi
        # apt's mirrors, by name. On 2026-11-11 Canonical's nameservers for
        # ubuntu.com stopped answering some resolvers, the runners' among
        # them, for hours, while Cloudflare's still answered. apt spends
        # three and a half minutes retrying a name that doesn't resolve, so
        # the names are asked first, then Cloudflare's resolver once, and
        # apt doesn't refresh its lists when neither answers.
        hosts=$(grep -rhoE 'https?://[^/[:space:]]+' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null |
          sed -E 's#^https?://##' | sort -u)
        resolves() {
          local host
          for host in $hosts; do
            timeout 15 getent ahosts "$host" >/dev/null || { echo "$host"; return 1; }
          done
        }
        if ! missing=$(resolves); then
          echo "::warning::This runner can't resolve $missing, so it asks Cloudflare's resolver (1.1.1.1) instead"
          link=$(ip -o route show default | awk '{ print $5; exit }')
          if sudo resolvectl dns "$link" 1.1.1.1 1.0.0.1; then
            sudo resolvectl flush-caches || true
          else
            echo "::warning::The resolver couldn't be changed here"
          fi
        fi
        if missing=$(resolves); then
          sudo apt-get update -q
        else
          echo "::warning::$missing doesn't resolve through Cloudflare's resolver either, so apt uses the image's own package lists, and only what's in the cache can install"
        fi
        read -ra packages <<<"$PACKAGES"
        apt-get install -qq --print-uris --no-install-recommends "${packages[@]}" >"$RUNNER_TEMP/$NAME-uris"
        echo "need=true" >>"$GITHUB_OUTPUT"
        echo "key=$NAME-debs-$(lsb_release -cs)-$(sha256sum <"$RUNNER_TEMP/$NAME-uris" | cut -c1-16)" >>"$GITHUB_OUTPUT"

    - name: ${{ inputs.name }}'s packages, from the cache
      id: restore
      if: steps.debs.outputs.need == 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/${{ inputs.name }}-debs
        key: ${{ steps.debs.outputs.key }}
        restore-keys: ${{ inputs.name }}-debs-

    - name: ${{ inputs.name }}, from the cache or the mirror
      if: steps.debs.outputs.need == 'true'
      shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
        COMMAND: ${{ inputs.command }}
        NAME: ${{ inputs.name }}
      run: |
        debs=$HOME/$NAME-debs
        mkdir -p "$debs/partial"
        read -ra packages <<<"$PACKAGES"
        sudo apt-get install -yq --no-install-recommends \
          -o Dir::Cache::archives="$debs/" -o APT::Keep-Downloaded-Packages=true -o Acquire::Retries=3 "${packages[@]}"
        sudo chown -R "$(id -u):$(id -g)" "$debs"
        rm -rf "$debs/partial" "$debs/lock"
        # Only what this install needed goes back in the cache, so an older
        # copy from restore-keys doesn't keep growing.
        for deb in "$debs"/*.deb; do
          [[ -e $deb ]] || continue
          grep -qF " $(basename "$deb") " "$RUNNER_TEMP/$NAME-uris" || rm -f "$deb"
        done
        type -P "$COMMAND"

    - name: ${{ inputs.name }}'s packages, into the cache
      if: steps.debs.outputs.need == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/${{ inputs.name }}-debs
        key: ${{ steps.debs.outputs.key }}
