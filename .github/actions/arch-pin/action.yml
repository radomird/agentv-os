name: arch-pin
description: >-
  Arch's container, pinned the way agentv-iso's agentv pins it, for every
  leg of an image run. agentv-iso's test/agentv/image/ci keeps the pin
  (ARCH_PIN), and tags it :latest for its own build and checks. A leg that
  checks with an older agentv-iso, such as a stable release's, has a ci from
  before the pin, so this reads ARCH_PIN from agentv-iso's agentv and does
  the same before that ci runs. The release's commit still decides what goes
  in the ISO; this only picks the container it's built and checked in. An
  empty ARCH_PIN does nothing. Needs GH_TOKEN and OWNER.

runs:
  using: composite
  steps:
    - name: Arch's container, as agentv-iso's agentv pins it
      shell: bash
      run: |
        ci=$(gh api -H "Accept: application/vnd.github.raw" "repos/$OWNER/agentv-iso/contents/test/agentv/image/ci?ref=agentv") ||
          { echo "::error::Couldn't read agentv-iso's test/agentv/image/ci at agentv, to see which Arch container it pins"; exit 1; }
        pin=$(sed -nE 's/^ARCH_PIN=([^[:space:]]*).*/\1/p' <<<"$ci" | head -n 1)
        if [[ -z $pin ]]; then
          echo "agentv-iso's agentv pins no Arch container, so this leg builds in Arch's :latest"
          exit 0
        fi
        if [[ ! $pin =~ ^ghcr\.io/archlinux/archlinux@sha256:[0-9a-f]{64}$ ]]; then
          echo "::error::agentv-iso's ARCH_PIN isn't Arch's container pinned by digest: $pin"
          exit 1
        fi
        docker pull -q "$pin" >/dev/null
        docker tag "$pin" ghcr.io/archlinux/archlinux:latest
        echo "This leg builds and checks in Arch's container $pin, pinned by agentv-iso's agentv, whichever agentv-iso it checks with." |
          tee -a "$GITHUB_STEP_SUMMARY"
