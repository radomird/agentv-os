name: Image

# AgenTV's image layer (ADR-019, layer 5) for a commit of agentv-os, with
# agentv-iso's harness checked out beside it: build the ISO, install it in a
# VM with KVM, boot it and run AgenTV's image checks.
#
# The ISO carries either packages built and signed from the commit itself
# (what a pull request needs) or the ones published on a channel (what the
# nightly run tests). With update-test, a second build of the same commit
# with a higher pkgrel is what the box updates to (S0.5). With update-checks,
# the checks that run that update (s0.5-update and update-tv) come from that
# agentv-iso ref rather than iso-ref's: the nightly run updates the stable
# release to tonight's agentv, so what happens after the update is the
# newer version's to check, while the rest of the release is checked as it
# was tagged. iso-ref's own update checks stand down, as they do when
# there's nothing to update to, so every update check runs once. With nightly, a
# passing run lists every package on the box, signs it as tested.json with
# the release key and publishes it on this repo's "tested" release, then
# checks that a box takes tonight's list and holds back anything else (S0.7).
# With keep-iso, an ISO that passed every check is kept as a workflow
# artifact: that's how the nightly run makes the edge ISO. With keep-disk,
# the box it installed is kept too, in the Actions cache, and a run with
# from-disk starts from the newest one kept on agentv (or on its own branch):
# it puts this commit's packages on that box, the way an update does, instead
# of building an ISO and installing it (Q100). With none to start from, it
# builds and installs, as before. With own-repo, the packages it built are
# also the box's repository for the run: its update check reads them
# instead of edge, so a pull request's run tests the pull request, updates
# included (Q137). Nightly and release runs keep their channels. With lanes,
# the image checks run that many VMs at a time (agentv-iso's
# test/agentv/image/run): two, unless a calling workflow asks otherwise. The
# checks that time the box against a bar, like S1.3, run alone after the
# lanes. A run by hand has two. With omarchy-channel, the update checks also
# move the box to the Omarchy on that channel, from the TV, and try Restart
# and Shut down on it (agentv-iso's omarchy-update check): rc tries the next
# Omarchy release before its stable channel serves it. Nightly runs leave it
# empty, so tested.json only ever lists what stable boxes can get. With
# omarchy-version too, that's the Omarchy release the box should end up on
# (4.6.0), when it isn't the one agentv-iso follows: the release candidate
# run (omarchy-rc.yml) names the candidate's. With
# checks, only the image checks named there run, by their file names in
# agentv-iso's test/agentv/image/ without -test.sh (s5.6-setup update-tv), so
# a fix to one check gets its answer in minutes: with from-disk too, that's
# the night's box with this commit's packages on it, and only those checks.
# A run that names its checks keeps nothing and signs nothing, since it
# didn't run them all.
#
# Which key signs the packages a run builds: a throwaway one made in the
# run (agentv-pkgs' bin/test-key), unless release-key is set. A pull
# request, a branch or a sync builds code nobody has reviewed yet, so it
# never gets AgenTV's own key. The run's agentv-keyring trusts the
# throwaway key too, so the run's box takes its packages, and nothing
# signed with it leaves the run. Only the nightly run sets release-key: it
# updates a box installed from a channel, which trusts AgenTV's key alone,
# and it signs tested.json. Its jobs then read AGENTV_SIGNING_KEY through
# the "release" environment, which only the agentv branch may use. The
# packages are built without any key (bin/build) and signed in a step of
# their own (bin/sign).
#
# With shards above 1 (4 unless a caller says otherwise), the run is shared
# out across jobs. One gets the box ready: it builds the ISO and installs
# it, hands the box on in pieces, as artifacts of the run, and runs the checks that
# look at the ISO itself, or it finds the night's box. Then up to that many
# jobs each run a share of the other checks against that box, two VMs at a
# time as before, with the checks that time the box against a bar on their
# own after the lanes, so each still has a whole runner
# (test/agentv/image/shards in agentv-iso shares them out). The last job
# reads every job's log and gives the same report one job did, then throws
# the run's box away once every check passed. When one failed, the box is
# kept for a day, so "Re-run failed jobs" runs the parts that failed against
# it. A night that signs tested.json, or whose update is
# checked with another agentv-iso, still runs in one job: it checks with
# the release's agentv-iso, which can't share its checks out.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentv-os commit or branch to test"
        type: string
        default: agentv
      iso-ref:
        description: "agentv-iso branch or tag with the image checks"
        type: string
        default: agentv
      pkgs-ref:
        description: "agentv-pkgs branch with the PKGBUILDs"
        type: string
        default: main
      packages:
        description: "Build the packages from that ref, or take a channel's"
        type: choice
        options: [build, stable, edge]
        default: build
      update-test:
        description: "Also update the box to a newer agentv (S0.5)"
        type: boolean
        default: true
      update-checks:
        description: "agentv-iso ref whose update checks run the update, when it isn't iso-ref (empty: iso-ref's)"
        type: string
        default: ""
      keep-iso:
        description: "Keep the ISO as an artifact when every check passes"
        type: boolean
        default: false
      keep-disk:
        description: "Keep the installed box in the Actions cache when every check passes, for runs that start from it"
        type: boolean
        default: false
      from-disk:
        description: "Start from the newest installed box a run kept in the cache, instead of building an ISO and installing it"
        type: boolean
        default: false
      own-repo:
        description: "Point the box's update check at the packages built from that ref, instead of edge"
        type: boolean
        default: false
      omarchy-channel:
        description: "Also move the box to the Omarchy on this channel after the update, from the TV: rc, or empty to stay on stable"
        type: string
        default: ""
      omarchy-version:
        description: "The Omarchy release that channel should bring, like 4.6.0 (empty: the one agentv-iso follows)"
        type: string
        default: ""
      checks:
        description: "Only these image checks, by name, like s5.6-setup update-tv (empty: every check). Quickest with from-disk"
        type: string
        default: ""
      shards:
        description: "How many jobs share the checks out (1: all in one job, as before)"
        type: number
        default: 4
      release-key:
        description: "Sign with AgenTV's own key, not a throwaway one. Only on agentv, and only with packages from a channel"
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      iso-ref:
        type: string
        default: agentv
      pkgs-ref:
        type: string
        default: main
      packages:
        type: string
        default: build
      update-test:
        type: boolean
        default: true
      update-checks:
        type: string
        default: ""
      nightly:
        type: boolean
        default: false
      keep-iso:
        type: boolean
        default: false
      keep-disk:
        type: boolean
        default: false
      from-disk:
        type: boolean
        default: false
      own-repo:
        type: boolean
        default: false
      omarchy-channel:
        type: string
        default: ""
      omarchy-version:
        type: string
        default: ""
      lanes:
        type: number
        default: 2
      checks:
        type: string
        default: ""
      shards:
        type: number
        default: 4
      release-key:
        type: boolean
        default: false
    # Only a caller that sets release-key hands it over, and only until the
    # key lives in the "release" environment, where the jobs read it from.
    secrets:
      AGENTV_SIGNING_KEY:
        required: false

permissions:
  contents: write
  # The last job of a shared-out run deletes the run's box, an ISO it kept
  # before a check failed, and the night's box and root image the Nightly no
  # longer needs from the cache.
  actions: write

jobs:
  image:
    name: "Build the ISO, install it, boot it, check it"
    if: ${{ !(inputs.shards > 1 && !inputs.nightly && inputs.update-checks == '') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    # AgenTV's own key is the environment's. Every other run names none.
    environment: ${{ inputs.release-key && 'release' || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      # The image checks two VMs at a time unless asked for one (agentv-iso's
      # test/agentv/image/run).
      AGENTV_TEST_LANES: ${{ inputs.lanes || 2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: os
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-pkgs
          ref: ${{ inputs.pkgs-ref }}
          path: pkgs
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-iso
          ref: ${{ inputs.iso-ref }}
          path: iso
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.update-test && inputs.update-checks != ''
        with:
          repository: ${{ github.repository_owner }}/agentv-iso
          ref: ${{ inputs.update-checks }}
          path: iso-next
          submodules: recursive
          persist-credentials: false

      # The commits this run builds, so whoever merges a change that comes
      # with an agentv-iso or agentv-pkgs branch can see they're still those
      # branches' heads.
      - name: The commits it builds
        id: commits
        env:
          OS_REF: ${{ inputs.ref }}
          ISO_REF: ${{ inputs.iso-ref }}
          PKGS_REF: ${{ inputs.pkgs-ref }}
        run: |
          commit() {
            local sha
            sha=$(git -C "$2" rev-parse HEAD)
            printf "%s [\`%s\`](https://github.com/%s/%s/commit/%s)" "$1" "${sha::7}" "$OWNER" "$1" "$sha"
            [[ $3 == "$sha" ]] || printf ' (%s)' "$3"
          }
          echo "Built from $(commit agentv-os os "$OS_REF"), $(commit agentv-iso iso "$ISO_REF") and $(commit agentv-pkgs pkgs "$PKGS_REF")." |
            tee -a "$GITHUB_STEP_SUMMARY"
          echo "iso=$(git -C iso rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          if (( $(avail) < 45 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
          fi
          echo "Free: $(avail) GB"
          (( $(avail) >= 40 )) || { echo "::error::only $(avail) GB free, the build and install test need about 40 GB"; exit 1; }

      # AgenTV's own key signs only what a channel's box updates to, built
      # from agentv-pkgs' main. Anything else gets a key made here, good for
      # a day, that only this run's box trusts.
      - name: The key this run's packages are signed with
        if: inputs.packages == 'build' || inputs.update-test
        env:
          RELEASE_KEY: ${{ inputs.release-key }}
          PACKAGES: ${{ inputs.packages }}
          PKGS_REF: ${{ inputs.pkgs-ref }}
        run: |
          if [[ $RELEASE_KEY == "true" ]]; then
            if [[ $PACKAGES == "build" || $PKGS_REF != "main" || $GITHUB_REF != "refs/heads/agentv" ]]; then
              echo "::error::AgenTV's own key signs only on agentv, with packages from a channel and agentv-pkgs' main. This run gets a throwaway key when release-key is off."
              exit 1
            fi
            echo "This run signs what the box updates to with AgenTV's own key." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $PACKAGES != "build" ]]; then
            echo "::error::A box installed from the $PACKAGES channel trusts AgenTV's key alone, so it won't take an update signed with a throwaway key. Build the packages (packages: build), turn update-test off, or run it on agentv with release-key."
            exit 1
          fi
          pkgs/bin/test-key "$RUNNER_TEMP/test-key"
          # The public half, where the build's container and the checks' can
          # read it. The key itself stays in the runner's own folder.
          mkdir -p iso/test-runs/test-key
          cp "$RUNNER_TEMP/test-key/public.asc" iso/test-runs/test-key/public.asc
          echo "AGENTV_TEST_PACKAGE_KEY=/w/test-runs/test-key/public.asc" >>"$GITHUB_ENV"
          echo "This run signs its packages with a throwaway key, $(cat "$RUNNER_TEMP/test-key/fingerprint"), which only its own box trusts." | tee -a "$GITHUB_STEP_SUMMARY"

      # Built with no key around (agentv-pkgs' bin/build). A run with a
      # throwaway key gets an agentv-keyring that trusts it too.
      - name: AgenTV's packages for the ISO
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          dest=iso/configs/airootfs/usr/share/agentv-iso/packages
          if [[ $PACKAGES == "build" ]]; then
            sha=$(git -C os rev-parse HEAD)
            mkdir -p repo
            docker run --rm -v "$PWD/pkgs:/src" -v "$PWD/repo:/repo" \
              -v "$PWD/iso/test-runs/test-key:/test-key:ro" -e AGENTV_TEST_KEY=/test-key/public.asc \
              -e AGENTV_CHANNEL=edge -e AGENTV_REF="commit=$sha" \
              -e AGENTV_SOURCE="https://github.com/$OWNER/agentv-os.git" \
              -e AGENTV_REPO_URL="https://github.com/$OWNER/agentv-pkgs/releases/download" \
              ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
            # The container wrote them as its own users.
            sudo chown -R "$(id -u):$(id -g)" repo
          else
            AGENTV_OWNER="$OWNER" iso/bin/agentv-iso-packages "$PACKAGES" "$dest"
            ls -l "$dest"
          fi

      # Packages are only built here for a run with a throwaway key (the
      # step above the build says so), so AgenTV's own key is never asked for.
      - name: Sign them with the run's throwaway key
        if: inputs.packages == 'build'
        env:
          OWN_REPO: ${{ inputs.own-repo }}
          AGENTV_TEST_KEY: ${{ runner.temp }}/test-key/public.asc
        run: |
          dest=iso/configs/airootfs/usr/share/agentv-iso/packages
          AGENTV_SIGNING_KEY=$(cat "$RUNNER_TEMP/test-key/secret.asc") pkgs/bin/sign repo
          mkdir -p "$dest"
          cp repo/agentv-*.pkg.tar.zst "$dest/"
          # The whole signed repository, served to the box for the run.
          if [[ $OWN_REPO == "true" ]]; then
            mkdir -p iso/test-runs
            cp -r repo iso/test-runs/own-repo
            echo "AGENTV_TEST_OWN_REPO=/w/test-runs/own-repo" >>"$GITHUB_ENV"
          fi
          ls -l "$dest"

      # Something newer to update to: the same commit with pkgrel 99, signed,
      # in a repository the VM reaches through QEMU's network.
      - name: A newer agentv for the update test (S0.5)
        id: update
        if: inputs.update-test
        env:
          RELEASE_KEY: ${{ inputs.release-key }}
          UPDATE_CHECKS: ${{ inputs.update-checks }}
        run: |
          sha=$(git -C os rev-parse HEAD)
          update=iso/test-runs/update-repo
          mkdir -p "$update"
          # A run with a throwaway key builds a keyring that trusts it.
          test_key=()
          if [[ $RELEASE_KEY != "true" ]]; then
            test_key=(-v "$PWD/iso/test-runs/test-key:/test-key:ro" -e AGENTV_TEST_KEY=/test-key/public.asc)
          fi
          docker run --rm -v "$PWD/pkgs:/src" -v "$PWD/$update:/repo" ${test_key[@]+"${test_key[@]}"} \
            -e AGENTV_CHANNEL=edge -e AGENTV_REF="commit=$sha" -e AGENTV_PKGREL=99 \
            -e AGENTV_SOURCE="https://github.com/$OWNER/agentv-os.git" \
            -e AGENTV_REPO_URL="https://github.com/$OWNER/agentv-pkgs/releases/download" \
            ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
          # The container wrote them as its own users.
          sudo chown -R "$(id -u):$(id -g)" "$update"
          version=$(find "$update" -maxdepth 1 -name 'agentv-[0-9]*-99-any.pkg.tar.zst' -printf '%f\n' |
            sed -E 's/^agentv-(.*)-any\.pkg\.tar\.zst$/\1/')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # With update-checks, only the step that runs those checks gets the
          # repository, so iso-ref's own update checks stand down.
          if [[ -z $UPDATE_CHECKS ]]; then
            echo "AGENTV_TEST_UPDATE_REPO=/w/test-runs/update-repo" >>"$GITHUB_ENV"
            echo "AGENTV_TEST_UPDATE_VERSION=$version" >>"$GITHUB_ENV"
          fi

      # The only step with a key in it, and all it runs is agentv-pkgs'
      # bin/sign, which fetches nothing. AgenTV's own key is here only when
      # release-key is set, from the "release" environment.
      - name: Sign the newer agentv
        if: inputs.update-test
        env:
          AGENTV_SIGNING_KEY: ${{ inputs.release-key && secrets.AGENTV_SIGNING_KEY || '' }}
          RELEASE_KEY: ${{ inputs.release-key }}
        run: |
          if [[ $RELEASE_KEY != "true" ]]; then
            AGENTV_SIGNING_KEY=$(cat "$RUNNER_TEMP/test-key/secret.asc")
            export AGENTV_SIGNING_KEY AGENTV_TEST_KEY="$RUNNER_TEMP/test-key/public.asc"
          fi
          pkgs/bin/sign iso/test-runs/update-repo

      # The newest box kept in the cache. A pull request reads the ones runs
      # on agentv kept, and a run on a branch its own too. The cache, unlike
      # an artifact, hands back a few GB in about a minute: an artifact took
      # 20 minutes for the box's 4.7 GB, which ate what starting from it saves.
      - name: The night's installed box
        id: disk
        if: inputs.from-disk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/test-runs/installed-disk
          key: installed-disk-none
          restore-keys: installed-disk-

      - name: Start from the night's installed box
        id: night
        if: inputs.from-disk
        env:
          KEPT: ${{ steps.disk.outputs.cache-matched-key }}
        run: |
          if [[ -z $KEPT || ! -f iso/test-runs/installed-disk/base.qcow2 || ! -f iso/test-runs/installed-disk/iso-name ]]; then
            echo "There's no installed box from a night's run to start from, so this run builds the ISO and installs it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "found=true" >>"$GITHUB_OUTPUT"
          echo "This run starts from the box a night's run installed ($(cat iso/test-runs/installed-disk/iso-name), kept as $KEPT), with this commit's packages put on it." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build, install, boot, check
        env:
          AGENTV_TEST_OMARCHY_CHANNEL: ${{ inputs.omarchy-channel }}
          AGENTV_TEST_OMARCHY_VERSION: ${{ inputs.omarchy-version }}
          AGENTV_TEST_TESTED_OUT: ${{ inputs.nightly && '/w/test-runs/tested-packages.txt' || '' }}
          AGENTV_TEST_KEEP_DISK: ${{ inputs.keep-disk && '/w/test-runs/installed-disk' || '' }}
          FROM_DISK: ${{ steps.night.outputs.found }}
          ONLY: ${{ inputs.checks }}
        run: |
          set -o pipefail
          read -ra checks <<<"$ONLY"
          if (( ${#checks[@]} > 0 )); then
            echo "Only these checks run: ${checks[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ $FROM_DISK == "true" ]]; then
            iso/test/agentv/image/ci --from-disk iso/test-runs/installed-disk "${checks[@]}" 2>&1 | tee image.log
          else
            iso/test/agentv/image/ci "${checks[@]}" 2>&1 | tee image.log
          fi

      # The same ISO and installed box, lent to update-checks' harness for its
      # update checks, then handed back for the steps after this one.
      - name: The update, checked as the version it updates to does (S0.5, S2.12)
        if: inputs.update-test && inputs.update-checks != ''
        env:
          AGENTV_TEST_UPDATE_REPO: /w/test-runs/update-repo
          AGENTV_TEST_UPDATE_VERSION: ${{ steps.update.outputs.version }}
          AGENTV_TEST_OMARCHY_CHANNEL: ${{ inputs.omarchy-channel }}
          AGENTV_TEST_OMARCHY_VERSION: ${{ inputs.omarchy-version }}
          UPDATE_CHECKS: ${{ inputs.update-checks }}
          ONLY: ${{ inputs.checks }}
        run: |
          set -o pipefail
          checks=(s0.5-update update-tv)
          [[ -z $AGENTV_TEST_OMARCHY_CHANNEL ]] || checks+=(omarchy-update)
          # With checks named, only the update checks among them.
          if [[ -n $ONLY ]]; then
            named=()
            for check in "${checks[@]}"; do
              [[ " $ONLY " != *" $check "* ]] || named+=("$check")
            done
            if (( ${#named[@]} == 0 )); then
              echo "None of the checks named is an update check, so the update isn't checked again." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            checks=("${named[@]}")
          fi
          mv iso/test-runs iso-next/test-runs
          mv iso/release iso-next/release
          trap 'mv iso-next/test-runs iso/test-runs; mv iso-next/release iso/release' EXIT
          echo "The update to agentv $AGENTV_TEST_UPDATE_VERSION, checked with agentv-iso $UPDATE_CHECKS" | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ " ${checks[*]} " == *" omarchy-update "* ]]; then
            echo "Then the box moves to the Omarchy on $AGENTV_TEST_OMARCHY_CHANNEL, from the TV" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          iso-next/test/agentv/image/ci --again "${checks[@]}" 2>&1 | tee -a image.log

      # Only a night where every check passed becomes tested.json.
      - name: Sign and publish tested.json
        if: inputs.nightly && inputs.checks == ''
        env:
          AGENTV_SIGNING_KEY: ${{ inputs.release-key && secrets.AGENTV_SIGNING_KEY || '' }}
        run: |
          if [[ -z $AGENTV_SIGNING_KEY ]]; then
            echo "::error::tested.json is signed with AgenTV's own key, and this run has none. Only the nightly run on agentv does (release-key)."
            exit 1
          fi
          list=iso/test-runs/tested-packages.txt
          test -s "$list"
          jq -Rn --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$GITHUB_RUN_ID" '
            [inputs | select(length > 0) | split(" ") | {key: .[0], value: .[1]}] | from_entries as $packages
            | {schema: 1, date: $date, run: $run,
               agentv: $packages.agentv, omarchy: $packages.omarchy, packages: $packages}
          ' <"$list" >tested.json
          # In, and straight out of the environment, before gh or anything
          # else runs in this step.
          key=$AGENTV_SIGNING_KEY
          unset AGENTV_SIGNING_KEY
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$key" | gpg --batch --quiet --import
          unset key
          gpg --batch --yes --detach-sign --output tested.json.sig tested.json
          rm -rf "$GNUPGHOME"
          if ! gh release view tested -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tested -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Tested by the nightly run" \
              --notes "tested.json lists every package version AgenTV's nightly run passed with. Boxes take an update only when it matches (ADR-026)."
          fi
          gh release upload tested -R "$GITHUB_REPOSITORY" --clobber tested.json tested.json.sig
          jq '{date, agentv, omarchy, packages: (.packages | length)}' tested.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: A box takes tonight's list, and holds back anything else (S0.7)
        if: inputs.nightly && inputs.checks == ''
        env:
          AGENTV_TEST_TESTED_LIVE: "1"
        run: set -o pipefail; iso/test/agentv/image/ci --again s0.7-tested 2>&1 | tee -a image.log

      # The name people download (ADR-027): the channel its packages came
      # from, the day and the agentv-os commit. At about 6.4 GB the ISO is
      # over the 2 GiB cap for release assets, so it stays a workflow artifact.
      - name: Name the ISO
        if: success() && inputs.keep-iso && inputs.checks == ''
        id: name
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          name="agentv-$PACKAGES-$(date -u +%Y.%m.%d)-$(git -C os rev-parse --short=7 HEAD)-x86_64"
          mv iso/release/*.iso "iso/release/$name.iso"
          (cd iso/release && sha256sum "$name.iso" >"$name.iso.sha256")
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "ISO: \`$name.iso\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the ISO
        if: success() && inputs.keep-iso && inputs.checks == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            iso/release/*.iso
            iso/release/*.iso.sha256
          compression-level: 0
          retention-days: 7

      # The checksum on its own too, a few bytes: agentv-iso's publish-iso.yml
      # signs it without fetching the ISO.
      - name: Keep the checksum
        if: success() && inputs.keep-iso && inputs.checks == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}.sha256
          path: iso/release/*.iso.sha256
          if-no-files-found: error
          retention-days: 7

      # The installed box, for the runs that start from it, under a key of
      # its own each night. The cache drops the ones no run has read for a
      # week, and the oldest first when it's full.
      - name: Keep the installed box
        if: success() && inputs.keep-disk && inputs.checks == ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/test-runs/installed-disk
          key: installed-disk-${{ github.run_id }}

      - name: Acceptance ids
        if: always()
        run: |
          result() {
            if grep -q "not ok - $1 " image.log 2>/dev/null; then echo fail
            elif grep -q "^ok - $1 " image.log 2>/dev/null; then echo pass
            else echo "not run"; fi
          }
          os/test/agentv/report image \
            "S0.1=$(result S0.1)" "S0.4=$(result S0.4)" "S0.5=$(result S0.5)" "S0.7=$(result S0.7)" \
            "S1.1=$(result S1.1)" "S1.3=$(result S1.3)" "S1.6=$(result S1.6)" "S1.7=$(result S1.7)" \
            "S2.14=$(result S2.14)" "S2.15=$(result S2.15)" "S2.16=$(result S2.16)" "S2.17=$(result S2.17)" "S2.18=$(result S2.18)" "S2.19=$(result S2.19)" \
            "S3.3=$(result S3.3)" "S3.6=$(result S3.6)" "S3.8=$(result S3.8)" "S3.9=$(result S3.9)" "S3.10=$(result S3.10)" \
            "S4.4=$(result S4.4)" "S4.5=$(result S4.5)" "S4.6=$(result S4.6)" \
            "S5.2=$(result S5.2)" "S5.3=$(result S5.3)" "S5.4=$(result S5.4)" "S5.5=$(result S5.5)" "S5.6=$(result S5.6)" "S5.7=$(result S5.7)" "S5.8=$(result S5.8)" "S5.10=$(result S5.10)" \
            "S6.3=$(result S6.3)" "S6.4=$(result S6.4)" "S6.5=$(result S6.5)" "S6.8=$(result S6.8)" "S6.10=$(result S6.10)" \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.packages }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            tested.json
            iso/test-runs/*/*.png
            iso/test-runs/*/serial.log
            iso/test-runs/*/omarchy-install.log
            iso/test-runs/*/runs/**/*.png
            iso/test-runs/*/runs/**/*.txt
            iso/test-runs/*/runs/**/*.json
            iso/test-runs/*/runs/**/*.log
            iso/test-runs/*/runs/**/*.wav
          if-no-files-found: ignore
          retention-days: 14

  # The run shared out (see the top of this file). These three jobs run
  # instead of the one above.
  box:
    name: "Get the box ready"
    if: inputs.shards > 1 && !inputs.nightly && inputs.update-checks == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    # AgenTV's own key is the environment's. Every other run names none.
    environment: ${{ inputs.release-key && 'release' || '' }}
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      AGENTV_TEST_LANES: ${{ inputs.lanes || 2 }}
    outputs:
      # A part run again by "Re-run failed jobs" fetches what this job made
      # in the attempt it ran in, not the part's own.
      attempt: ${{ github.run_attempt }}
      pieces: ${{ steps.pieces.outputs.count }}
      iso: ${{ steps.commits.outputs.iso }}
      night: ${{ steps.night.outputs.key }}
      plan: ${{ steps.plan.outputs.parts }}
      ready: ${{ steps.ready.outputs.ready }}
      update-version: ${{ steps.update.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: os
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-pkgs
          ref: ${{ inputs.pkgs-ref }}
          path: pkgs
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-iso
          ref: ${{ inputs.iso-ref }}
          path: iso
          submodules: recursive
          persist-credentials: false

      # The commits this run builds, so whoever merges a change that comes
      # with an agentv-iso or agentv-pkgs branch can see they're still those
      # branches' heads.
      - name: The commits it builds
        id: commits
        env:
          OS_REF: ${{ inputs.ref }}
          ISO_REF: ${{ inputs.iso-ref }}
          PKGS_REF: ${{ inputs.pkgs-ref }}
        run: |
          commit() {
            local sha
            sha=$(git -C "$2" rev-parse HEAD)
            printf "%s [\`%s\`](https://github.com/%s/%s/commit/%s)" "$1" "${sha::7}" "$OWNER" "$1" "$sha"
            [[ $3 == "$sha" ]] || printf ' (%s)' "$3"
          }
          echo "Built from $(commit agentv-os os "$OS_REF"), $(commit agentv-iso iso "$ISO_REF") and $(commit agentv-pkgs pkgs "$PKGS_REF")." |
            tee -a "$GITHUB_STEP_SUMMARY"
          echo "iso=$(git -C iso rev-parse HEAD)" >>"$GITHUB_OUTPUT"

      # These three are the same as the one job's above. Keep them in step.
      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          if (( $(avail) < 45 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
          fi
          echo "Free: $(avail) GB"
          (( $(avail) >= 40 )) || { echo "::error::only $(avail) GB free, the build and install test need about 40 GB"; exit 1; }

      # AgenTV's own key signs only what a channel's box updates to, built
      # from agentv-pkgs' main. Anything else gets a key made here, good for
      # a day, that only this run's box trusts.
      - name: The key this run's packages are signed with
        if: inputs.packages == 'build' || inputs.update-test
        env:
          RELEASE_KEY: ${{ inputs.release-key }}
          PACKAGES: ${{ inputs.packages }}
          PKGS_REF: ${{ inputs.pkgs-ref }}
        run: |
          if [[ $RELEASE_KEY == "true" ]]; then
            if [[ $PACKAGES == "build" || $PKGS_REF != "main" || $GITHUB_REF != "refs/heads/agentv" ]]; then
              echo "::error::AgenTV's own key signs only on agentv, with packages from a channel and agentv-pkgs' main. This run gets a throwaway key when release-key is off."
              exit 1
            fi
            echo "This run signs what the box updates to with AgenTV's own key." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [[ $PACKAGES != "build" ]]; then
            echo "::error::A box installed from the $PACKAGES channel trusts AgenTV's key alone, so it won't take an update signed with a throwaway key. Build the packages (packages: build), turn update-test off, or run it on agentv with release-key."
            exit 1
          fi
          pkgs/bin/test-key "$RUNNER_TEMP/test-key"
          # The public half, where the build's container and the checks' can
          # read it. The key itself stays in the runner's own folder.
          mkdir -p iso/test-runs/test-key
          cp "$RUNNER_TEMP/test-key/public.asc" iso/test-runs/test-key/public.asc
          echo "AGENTV_TEST_PACKAGE_KEY=/w/test-runs/test-key/public.asc" >>"$GITHUB_ENV"
          echo "This run signs its packages with a throwaway key, $(cat "$RUNNER_TEMP/test-key/fingerprint"), which only its own box trusts." | tee -a "$GITHUB_STEP_SUMMARY"

      # Built with no key around (agentv-pkgs' bin/build). A run with a
      # throwaway key gets an agentv-keyring that trusts it too.
      - name: AgenTV's packages for the ISO
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          dest=iso/configs/airootfs/usr/share/agentv-iso/packages
          if [[ $PACKAGES == "build" ]]; then
            sha=$(git -C os rev-parse HEAD)
            mkdir -p repo
            docker run --rm -v "$PWD/pkgs:/src" -v "$PWD/repo:/repo" \
              -v "$PWD/iso/test-runs/test-key:/test-key:ro" -e AGENTV_TEST_KEY=/test-key/public.asc \
              -e AGENTV_CHANNEL=edge -e AGENTV_REF="commit=$sha" \
              -e AGENTV_SOURCE="https://github.com/$OWNER/agentv-os.git" \
              -e AGENTV_REPO_URL="https://github.com/$OWNER/agentv-pkgs/releases/download" \
              ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
            # The container wrote them as its own users.
            sudo chown -R "$(id -u):$(id -g)" repo
          else
            AGENTV_OWNER="$OWNER" iso/bin/agentv-iso-packages "$PACKAGES" "$dest"
            ls -l "$dest"
          fi

      # Packages are only built here for a run with a throwaway key (the
      # step above the build says so), so AgenTV's own key is never asked for.
      - name: Sign them with the run's throwaway key
        if: inputs.packages == 'build'
        env:
          OWN_REPO: ${{ inputs.own-repo }}
          AGENTV_TEST_KEY: ${{ runner.temp }}/test-key/public.asc
        run: |
          dest=iso/configs/airootfs/usr/share/agentv-iso/packages
          AGENTV_SIGNING_KEY=$(cat "$RUNNER_TEMP/test-key/secret.asc") pkgs/bin/sign repo
          mkdir -p "$dest"
          cp repo/agentv-*.pkg.tar.zst "$dest/"
          # The whole signed repository, served to the box for the run.
          if [[ $OWN_REPO == "true" ]]; then
            mkdir -p iso/test-runs
            cp -r repo iso/test-runs/own-repo
            echo "AGENTV_TEST_OWN_REPO=/w/test-runs/own-repo" >>"$GITHUB_ENV"
          fi
          ls -l "$dest"

      # Something newer to update to: the same commit with pkgrel 99, signed,
      # in a repository the VM reaches through QEMU's network.
      - name: A newer agentv for the update test (S0.5)
        id: update
        if: inputs.update-test
        env:
          RELEASE_KEY: ${{ inputs.release-key }}
          UPDATE_CHECKS: ${{ inputs.update-checks }}
        run: |
          sha=$(git -C os rev-parse HEAD)
          update=iso/test-runs/update-repo
          mkdir -p "$update"
          # A run with a throwaway key builds a keyring that trusts it.
          test_key=()
          if [[ $RELEASE_KEY != "true" ]]; then
            test_key=(-v "$PWD/iso/test-runs/test-key:/test-key:ro" -e AGENTV_TEST_KEY=/test-key/public.asc)
          fi
          docker run --rm -v "$PWD/pkgs:/src" -v "$PWD/$update:/repo" ${test_key[@]+"${test_key[@]}"} \
            -e AGENTV_CHANNEL=edge -e AGENTV_REF="commit=$sha" -e AGENTV_PKGREL=99 \
            -e AGENTV_SOURCE="https://github.com/$OWNER/agentv-os.git" \
            -e AGENTV_REPO_URL="https://github.com/$OWNER/agentv-pkgs/releases/download" \
            ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
          # The container wrote them as its own users.
          sudo chown -R "$(id -u):$(id -g)" "$update"
          version=$(find "$update" -maxdepth 1 -name 'agentv-[0-9]*-99-any.pkg.tar.zst' -printf '%f\n' |
            sed -E 's/^agentv-(.*)-any\.pkg\.tar\.zst$/\1/')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # With update-checks, only the step that runs those checks gets the
          # repository, so iso-ref's own update checks stand down.
          if [[ -z $UPDATE_CHECKS ]]; then
            echo "AGENTV_TEST_UPDATE_REPO=/w/test-runs/update-repo" >>"$GITHUB_ENV"
            echo "AGENTV_TEST_UPDATE_VERSION=$version" >>"$GITHUB_ENV"
          fi

      # The only step with a key in it, and all it runs is agentv-pkgs'
      # bin/sign, which fetches nothing. AgenTV's own key is here only when
      # release-key is set, from the "release" environment.
      - name: Sign the newer agentv
        if: inputs.update-test
        env:
          AGENTV_SIGNING_KEY: ${{ inputs.release-key && secrets.AGENTV_SIGNING_KEY || '' }}
          RELEASE_KEY: ${{ inputs.release-key }}
        run: |
          if [[ $RELEASE_KEY != "true" ]]; then
            AGENTV_SIGNING_KEY=$(cat "$RUNNER_TEMP/test-key/secret.asc")
            export AGENTV_SIGNING_KEY AGENTV_TEST_KEY="$RUNNER_TEMP/test-key/public.asc"
          fi
          pkgs/bin/sign iso/test-runs/update-repo

      # Only whether there's one, and its key: each job that runs checks
      # fetches it itself.
      - name: The night's installed box
        id: lookup
        if: inputs.from-disk
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/test-runs/installed-disk
          key: installed-disk-none
          restore-keys: installed-disk-
          lookup-only: true

      - name: Start from the night's installed box
        id: night
        if: inputs.from-disk
        env:
          KEPT: ${{ steps.lookup.outputs.cache-matched-key }}
        run: |
          if [[ -z $KEPT ]]; then
            echo "There's no installed box from a night's run to start from, so this run builds the ISO and installs it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "key=$KEPT" >>"$GITHUB_OUTPUT"
          echo "This run starts from the box a night's run installed (kept as $KEPT), with this commit's packages put on it." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Share the checks out
        id: plan
        env:
          ONLY: ${{ inputs.checks }}
          SHARDS: ${{ inputs.shards }}
          ISO_REF: ${{ inputs.iso-ref }}
          NIGHT: ${{ steps.night.outputs.key }}
        run: |
          read -ra checks <<<"$ONLY"
          if (( ${#checks[@]} > 0 )); then
            echo "Only these checks run: ${checks[*]}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          if [[ ! -x iso/test/agentv/image/shards ]]; then
            echo "::error::agentv-iso $ISO_REF can't share its checks out across jobs. Run this with shards set to 1."
            exit 1
          fi
          plan=$(iso/test/agentv/image/shards "$SHARDS" "${checks[@]}")
          echo "parts=$(jq -c .parts <<<"$plan")" >>"$GITHUB_OUTPUT"
          echo "box=$(jq -r .box <<<"$plan")" >>"$GITHUB_OUTPUT"
          jq -r '.parts[] | "Part \(.part) of \(.of), about \((.about + 59) / 60 | floor) min of checks: \(.checks)"' <<<"$plan" |
            tee -a "$GITHUB_STEP_SUMMARY"
          box=$(jq -r .box <<<"$plan")
          if [[ -n $box && -n $NIGHT ]]; then
            # As the one job says it, from the night's disk.
            for name in $box; do
              printf "==> %s: skipped, since this run started from the night's disk and has no ISO\n" "$name-test.sh" | tee -a image.log
            done
          elif [[ -n $box ]]; then
            echo "This job runs the checks that look at the ISO itself: $box" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The slow part of the root image, Omarchy's 900 or so packages
      # pacstrapped into btrfs, from an earlier build when nothing in it
      # changed (agentv-iso's bin/agentv-iso-root-cache). Only runs on agentv
      # keep one, which in practice is the Nightly: those are the ones every
      # pull request can read, and the cache holds only 10 GB, so a pull
      # request's own copy for its reruns isn't worth what it pushes out. An
      # ISO that's kept is made from scratch, though it still leaves its part
      # for the next run.
      - name: The root image's slow part, from an earlier build
        id: root-cached
        if: steps.night.outputs.key == '' && !inputs.keep-iso
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/release/root-cache
          key: agentv-root-image-none
          restore-keys: agentv-root-image-

      - name: Build the ISO and install it
        id: build
        if: steps.night.outputs.key == ''
        env:
          AGENTV_TEST_OMARCHY_CHANNEL: ${{ inputs.omarchy-channel }}
          AGENTV_TEST_OMARCHY_VERSION: ${{ inputs.omarchy-version }}
          AGENTV_ROOT_CACHE: "1"
          AGENTV_ROOT_CACHE_FRESH: ${{ inputs.keep-iso && '1' || '' }}
        run: set -o pipefail; iso/test/agentv/image/ci --hand-on iso/test-runs/box --no-checks 2>&1 | tee -a image.log

      - name: Which root image it used
        id: root
        if: steps.build.outcome == 'success'
        env:
          HAD: ${{ steps.root-cached.outputs.cache-matched-key }}
        run: |
          key=$(cat iso/release/root-cache/key 2>/dev/null || true)
          how=$(cat iso/release/root-cache/how 2>/dev/null || true)
          echo "key=$key" >>"$GITHUB_OUTPUT"
          if [[ $how == "hit" ]]; then
            echo "The root image's Omarchy part came from an earlier build ($key)." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ -n $key && $GITHUB_REF != "refs/heads/agentv" ]]; then
            echo "The root image's Omarchy part was built in this run ($key). Only runs on agentv keep it, so the next Nightly will." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [[ -n $key ]]; then
            echo "The root image's Omarchy part was built in this run ($key), and kept for the runs after it." | tee -a "$GITHUB_STEP_SUMMARY"
            [[ $HAD == "agentv-root-image-$key" ]] || echo "save=true" >>"$GITHUB_OUTPUT"
          fi
          echo "Build: $(cat iso/test-runs/build-seconds 2>/dev/null || echo ?) s." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the root image's slow part
        id: root-saved
        if: steps.root.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/release/root-cache
          key: agentv-root-image-${{ steps.root.outputs.key }}

      # One root image part in the cache at a time, as with the night's box:
      # an older one is for packages that have moved on.
      - name: Only this root image's part
        if: steps.root-saved.outcome == 'success'
        env:
          KEEP: agentv-root-image-${{ steps.root.outputs.key }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key agentv-root-image- --limit 100 --json key --jq '.[].key' |
            while read -r key; do
              [[ $key == "$KEEP" ]] || gh cache delete "$key" -R "$GITHUB_REPOSITORY" || echo "::warning::couldn't delete $key"
            done

      # The installed box, as artifacts of this run that last a day. It went
      # through the Actions cache before, but the cache holds 10 GB for every
      # run, and with a few full runs going, other runs' boxes pushed this one
      # out before the parts came for it. In one piece, its 4.7 GB took 4 to
      # 7 minutes to come down. In ten, which each part fetches five at a
      # time, they take about half a minute, and about 35 s to go up. The last
      # job deletes them once every check passed.
      - name: Cut the box into pieces
        id: pieces
        if: steps.build.outcome == 'success'
        run: |
          mkdir -p box-pieces
          size=$(du -sb iso/test-runs/box | cut -f1)
          # Ten pieces at most, with room for tar's own headers.
          tar -cf - -C iso/test-runs box | split -d -a 2 -b $(( (size + 1048576) / 10 + 1 )) - box-pieces/box.tar.
          ls -l box-pieces
          echo "count=$(find box-pieces -name 'box.tar.*' | wc -l)" >>"$GITHUB_OUTPUT"

      - name: Hand the box on, piece 1
        if: steps.pieces.outputs.count > 0
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-00
          path: box-pieces/box.tar.00
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 2
        if: steps.pieces.outputs.count > 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-01
          path: box-pieces/box.tar.01
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 3
        if: steps.pieces.outputs.count > 2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-02
          path: box-pieces/box.tar.02
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 4
        if: steps.pieces.outputs.count > 3
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-03
          path: box-pieces/box.tar.03
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 5
        if: steps.pieces.outputs.count > 4
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-04
          path: box-pieces/box.tar.04
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 6
        if: steps.pieces.outputs.count > 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-05
          path: box-pieces/box.tar.05
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 7
        if: steps.pieces.outputs.count > 6
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-06
          path: box-pieces/box.tar.06
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 8
        if: steps.pieces.outputs.count > 7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-07
          path: box-pieces/box.tar.07
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 9
        if: steps.pieces.outputs.count > 8
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-08
          path: box-pieces/box.tar.08
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Hand the box on, piece 10
        if: steps.pieces.outputs.count > 9
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-box-${{ github.run_id }}-${{ github.run_attempt }}-09
          path: box-pieces/box.tar.09
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Room on the disk again
        if: steps.pieces.outcome == 'success'
        run: rm -r box-pieces

      # In one tar, so each folder lands where it was, whichever of them
      # this run has.
      - name: Pack the packages
        run: |
          folders=(configs/airootfs/usr/share/agentv-iso/packages)
          for folder in test-runs/update-repo test-runs/own-repo test-runs/test-key; do
            [[ -d iso/$folder ]] && folders+=("$folder")
          done
          tar -cf box-packages.tar -C iso "${folders[@]}"
          ls -l box-packages.tar

      - name: Hand the packages on
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: box-packages-${{ github.run_id }}-${{ github.run_attempt }}
          path: box-packages.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: The box is ready
        id: ready
        run: echo "ready=true" >>"$GITHUB_OUTPUT"

      - name: The checks that look at the ISO itself
        if: steps.build.outcome == 'success' && steps.plan.outputs.box != ''
        env:
          BOX: ${{ steps.plan.outputs.box }}
        run: |
          set -o pipefail
          read -ra checks <<<"$BOX"
          iso/test/agentv/image/ci --again "${checks[@]}" 2>&1 | tee -a image.log

      # The ISO goes up now, while this job has it. If a check fails in
      # another job, the last job deletes it again.
      - name: Name the ISO
        if: success() && steps.build.outcome == 'success' && inputs.keep-iso && inputs.checks == ''
        id: name
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          name="agentv-$PACKAGES-$(date -u +%Y.%m.%d)-$(git -C os rev-parse --short=7 HEAD)-x86_64"
          mv iso/release/*.iso "iso/release/$name.iso"
          (cd iso/release && sha256sum "$name.iso" >"$name.iso.sha256")
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "ISO: \`$name.iso\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the ISO
        if: success() && steps.name.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            iso/release/*.iso
            iso/release/*.iso.sha256
          compression-level: 0
          retention-days: 7

      # The checksum on its own too, a few bytes: agentv-iso's publish-iso.yml
      # signs it without fetching the ISO.
      - name: Keep the checksum
        if: success() && steps.name.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}.sha256
          path: iso/release/*.iso.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ inputs.packages }}-0-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            iso/test-runs/build-seconds
            iso/test-runs/*/*.png
            iso/test-runs/*/serial.log
            iso/test-runs/*/omarchy-install.log
            iso/test-runs/*/omarchy-install-timing.json
            iso/test-runs/*/runs/**/*.png
            iso/test-runs/*/runs/**/*.txt
            iso/test-runs/*/runs/**/*.json
            iso/test-runs/*/runs/**/*.log
            iso/test-runs/*/runs/**/*.wav
          if-no-files-found: ignore
          retention-days: 14

  checks:
    name: "Check it, part ${{ matrix.part }} of ${{ matrix.of }}"
    needs: box
    if: always() && needs.box.outputs.ready == 'true' && needs.box.outputs.plan != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.box.outputs.plan) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      AGENTV_TEST_LANES: ${{ inputs.lanes || 2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-iso
          # The commit the box job checked out, even if the branch moved since.
          ref: ${{ needs.box.outputs.iso || inputs.iso-ref }}
          path: iso
          persist-credentials: false

      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          if (( $(avail) < 30 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
          fi
          echo "Free: $(avail) GB"
          (( $(avail) >= 25 )) || { echo "::error::only $(avail) GB free, the box and its checks need about 25 GB"; exit 1; }

      - name: This run's packages
        id: packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: box-packages-${{ github.run_id }}-${{ needs.box.outputs.attempt }}

      # What the one job's steps set for its checks, from the same packages.
      - name: Point the checks at them
        env:
          OWN_REPO: ${{ inputs.own-repo }}
          VERSION: ${{ needs.box.outputs.update-version }}
        run: |
          tar -xf box-packages.tar -C iso
          ls -l iso/configs/airootfs/usr/share/agentv-iso/packages
          if [[ $OWN_REPO == "true" ]]; then
            echo "AGENTV_TEST_OWN_REPO=/w/test-runs/own-repo" >>"$GITHUB_ENV"
          fi
          if [[ -n $VERSION ]]; then
            echo "AGENTV_TEST_UPDATE_REPO=/w/test-runs/update-repo" >>"$GITHUB_ENV"
            echo "AGENTV_TEST_UPDATE_VERSION=$VERSION" >>"$GITHUB_ENV"
          fi
          # The public half of the run's throwaway key, when it has one.
          if [[ -f iso/test-runs/test-key/public.asc ]]; then
            echo "AGENTV_TEST_PACKAGE_KEY=/w/test-runs/test-key/public.asc" >>"$GITHUB_ENV"
          fi

      - name: The night's installed box
        id: night
        if: needs.box.outputs.night != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/test-runs/installed-disk
          key: ${{ needs.box.outputs.night }}
          fail-on-cache-miss: true

      - name: The box this run installed
        id: box
        if: needs.box.outputs.night == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-box-${{ github.run_id }}-${{ needs.box.outputs.attempt }}-*
          merge-multiple: true
          path: box-pieces

      - name: Put the box together
        id: together
        if: needs.box.outputs.night == ''
        env:
          PIECES: ${{ needs.box.outputs.pieces }}
        run: |
          found=$(find box-pieces -name 'box.tar.*' 2>/dev/null | wc -l)
          if (( found == 0 || found != PIECES )); then
            echo "Found $found of the box's $PIECES pieces."
            exit 1
          fi
          mkdir -p iso/test-runs
          cat box-pieces/box.tar.* | tar -xf - -C iso/test-runs
          rm -r box-pieces
          du -sh iso/test-runs/box

      # What a part needs and couldn't fetch, in words: the job's red either
      # way, but "Unable to find" doesn't say what to do.
      - name: Say what's gone
        if: failure() && (steps.packages.outcome == 'failure' || steps.night.outcome == 'failure' || steps.box.outcome == 'failure' || steps.together.outcome == 'failure')
        env:
          NIGHT: ${{ steps.night.outcome }}
        run: |
          if [[ $NIGHT == "failure" ]]; then
            echo "::error::The night's box this run started from isn't in the cache any more: a newer night replaced it. Run the whole workflow again (Re-run all jobs), not only this part."
          else
            echo "::error::This run's box and packages aren't there any more. A run keeps them for a day, and throws the box away once every check passed. Run the whole workflow again (Re-run all jobs), not only this part."
          fi

      - name: Check it
        env:
          AGENTV_TEST_OMARCHY_CHANNEL: ${{ inputs.omarchy-channel }}
          AGENTV_TEST_OMARCHY_VERSION: ${{ inputs.omarchy-version }}
          NIGHT: ${{ needs.box.outputs.night }}
          SHARE: ${{ matrix.checks }}
        run: |
          set -o pipefail
          read -ra checks <<<"$SHARE"
          if [[ -n $NIGHT ]]; then
            iso/test/agentv/image/ci --from-disk iso/test-runs/installed-disk "${checks[@]}" 2>&1 | tee image.log
          else
            iso/test/agentv/image/ci --from-build iso/test-runs/box "${checks[@]}" 2>&1 | tee image.log
          fi

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checks-${{ inputs.packages }}-${{ matrix.part }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            iso/test-runs/*/*.png
            iso/test-runs/*/serial.log
            iso/test-runs/*/runs/**/*.png
            iso/test-runs/*/runs/**/*.txt
            iso/test-runs/*/runs/**/*.json
            iso/test-runs/*/runs/**/*.log
            iso/test-runs/*/runs/**/*.wav
          if-no-files-found: ignore
          retention-days: 14

  finish:
    name: "Which image checks passed"
    needs: [box, checks]
    if: always() && inputs.shards > 1 && !inputs.nightly && inputs.update-checks == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: os
          sparse-checkout: test/agentv
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          # Every attempt's: a part that passed isn't run again with the ones
          # that failed, so its log is the earlier attempt's.
          pattern: checks-${{ inputs.packages }}-*-${{ github.run_id }}-*
          path: parts

      # One log, the box's first and then each part's, as one job would have
      # written it.
      - name: One log for the run
        env:
          PACKAGES: ${{ inputs.packages }}
          RUN: ${{ github.run_id }}
        run: |
          : >image.log
          for (( part = 0; ; part++ )); do
            # The part's newest attempt.
            dir=$(find parts -maxdepth 1 -type d -name "checks-$PACKAGES-$part-$RUN-*" | sort -V | tail -n 1)
            if [[ -z $dir ]]; then
              (( part == 0 )) && continue
              break
            fi
            [[ -f $dir/image.log ]] && cat "$dir/image.log" >>image.log
          done
          echo "$(grep -c . image.log) lines from $(find parts -maxdepth 1 -mindepth 1 -type d | wc -l) jobs"

      - name: Acceptance ids
        if: always()
        run: |
          result() {
            if grep -q "not ok - $1 " image.log 2>/dev/null; then echo fail
            elif grep -q "^ok - $1 " image.log 2>/dev/null; then echo pass
            else echo "not run"; fi
          }
          os/test/agentv/report image \
            "S0.1=$(result S0.1)" "S0.4=$(result S0.4)" "S0.5=$(result S0.5)" "S0.7=$(result S0.7)" \
            "S1.1=$(result S1.1)" "S1.3=$(result S1.3)" "S1.6=$(result S1.6)" "S1.7=$(result S1.7)" \
            "S2.14=$(result S2.14)" "S2.15=$(result S2.15)" "S2.16=$(result S2.16)" "S2.17=$(result S2.17)" "S2.18=$(result S2.18)" "S2.19=$(result S2.19)" \
            "S3.3=$(result S3.3)" "S3.6=$(result S3.6)" "S3.8=$(result S3.8)" "S3.9=$(result S3.9)" "S3.10=$(result S3.10)" \
            "S4.4=$(result S4.4)" "S4.5=$(result S4.5)" "S4.6=$(result S4.6)" \
            "S5.2=$(result S5.2)" "S5.3=$(result S5.3)" "S5.4=$(result S5.4)" "S5.5=$(result S5.5)" "S5.6=$(result S5.6)" "S5.7=$(result S5.7)" "S5.8=$(result S5.8)" "S5.10=$(result S5.10)" \
            "S6.3=$(result S6.3)" "S6.4=$(result S6.4)" "S6.5=$(result S6.5)" "S6.8=$(result S6.8)" "S6.10=$(result S6.10)" \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Did every check pass?
        id: passed
        env:
          BOX: ${{ needs.box.result }}
          CHECKS: ${{ needs.checks.result }}
          PLAN: ${{ needs.box.outputs.plan }}
        run: |
          if [[ $BOX == "success" && ( $CHECKS == "success" || ( $CHECKS == "skipped" && $PLAN == "[]" ) ) ]]; then
            echo "passed=true" >>"$GITHUB_OUTPUT"
          else
            echo "Getting the box ready: $BOX. The checks: $CHECKS." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # The night's box, for the runs that start from it, as the one job
      # keeps it: under a key of its own each night, only when every check
      # passed, and never one pointed at a pull request's own packages.
      - name: The box this run installed
        if: steps.passed.outputs.passed == 'true' && inputs.keep-disk && inputs.checks == '' && !inputs.own-repo && needs.box.outputs.night == ''
        id: kept
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-box-${{ github.run_id }}-${{ needs.box.outputs.attempt }}-*
          merge-multiple: true
          path: box-pieces

      - name: Name it the night's box
        if: steps.kept.outcome == 'success'
        env:
          PIECES: ${{ needs.box.outputs.pieces }}
        run: |
          found=$(find box-pieces -name 'box.tar.*' | wc -l)
          (( found > 0 && found == PIECES )) || { echo "::error::found $found of the box's $PIECES pieces"; exit 1; }
          mkdir -p iso/test-runs
          cat box-pieces/box.tar.* | tar -xf - -C iso/test-runs
          rm -r box-pieces
          mv iso/test-runs/box iso/test-runs/installed-disk
          du -sh iso/test-runs/installed-disk

      - name: Keep the installed box
        id: saved
        if: steps.kept.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: iso/test-runs/installed-disk
          key: installed-disk-${{ github.run_id }}

      # One night's box in the cache at a time. With the root image's part
      # that's about 8.5 of its 10 GB, so neither is pushed out by the other
      # night's.
      - name: Only tonight's box
        if: steps.saved.outcome == 'success'
        env:
          KEEP: installed-disk-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key installed-disk- --limit 100 --json key --jq '.[].key' |
            while read -r key; do
              [[ $key == "$KEEP" ]] || gh cache delete "$key" -R "$GITHUB_REPOSITORY" || echo "::warning::couldn't delete $key"
            done

      # Only an ISO that went through every check is kept.
      - name: Take back the ISO
        if: always() && steps.passed.outputs.passed != 'true' && inputs.keep-iso
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name | startswith(\"agentv-$PACKAGES-\")) | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
              echo "A check failed, so the ISO isn't kept (artifact $id deleted)." | tee -a "$GITHUB_STEP_SUMMARY"
            done

      # The run's box goes once every check passed. When one failed, it stays
      # for the day its artifact lasts, so "Re-run failed jobs" can run the
      # parts that failed against it.
      - name: Throw the run's box away
        if: always() && steps.passed.outputs.passed == 'true' && needs.box.outputs.night == ''
        env:
          BOX: image-box-${{ github.run_id }}-${{ needs.box.outputs.attempt }}-
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq ".artifacts[] | select(.name | startswith(\"$BOX\")) | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" || echo "::warning::couldn't delete a piece of the run's box (artifact $id). It goes in a day anyway."
            done

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.packages }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: image.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Say so
        if: steps.passed.outputs.passed != 'true'
        run: |
          echo "::error::Not every image check passed. Each job's log says which, and so does the report above."
          exit 1
