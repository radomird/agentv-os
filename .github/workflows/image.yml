name: Image

# AgenTV's image layer (ADR-019, layer 5) for a commit of agentv-os, with
# agentv-iso's harness checked out beside it: build the ISO, install it in a
# VM with KVM, boot it and run AgenTV's image checks.
#
# The ISO carries either packages built and signed from the commit itself
# (what a pull request needs) or the ones published on a channel (what the
# nightly run tests). With update-test, a second build of the same commit
# with a higher pkgrel is what the box updates to (S0.5). With update-checks,
# the checks that run that update (s0.5-update and update-tv) come from that
# agentv-iso ref rather than iso-ref's: the nightly run updates the stable
# release to tonight's agentv, so what happens after the update is the
# newer version's to check, while the rest of the release is checked as it
# was tagged. iso-ref's own update checks stand down, as they do when
# there's nothing to update to, so every update check runs once. With nightly, a
# passing run lists every package on the box, signs it as tested.json with
# the release key and publishes it on this repo's "tested" release, then
# checks that a box takes tonight's list and holds back anything else (S0.7).
# With keep-iso, an ISO that passed every check is kept as a workflow
# artifact: that's how the nightly run makes the edge ISO. With keep-disk,
# the box it installed is kept too, as the installed-disk artifact, and a run
# with from-disk starts from the newest one a run on agentv kept: it puts this
# commit's packages on that box, the way an update does, instead of building
# an ISO and installing it (Q100). With none to start from, it builds and
# installs, as before.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "agentv-os commit or branch to test"
        type: string
        default: agentv
      iso-ref:
        description: "agentv-iso branch or tag with the image checks"
        type: string
        default: agentv
      pkgs-ref:
        description: "agentv-pkgs branch with the PKGBUILDs"
        type: string
        default: main
      packages:
        description: "Build the packages from that ref, or take a channel's"
        type: choice
        options: [build, stable, edge]
        default: build
      update-test:
        description: "Also update the box to a newer agentv (S0.5)"
        type: boolean
        default: true
      update-checks:
        description: "agentv-iso ref whose update checks run the update, when it isn't iso-ref (empty: iso-ref's)"
        type: string
        default: ""
      keep-iso:
        description: "Keep the ISO as an artifact when every check passes"
        type: boolean
        default: false
      keep-disk:
        description: "Keep the installed box as an artifact when every check passes, for runs that start from it"
        type: boolean
        default: false
      from-disk:
        description: "Start from the installed box a run on agentv kept, instead of building an ISO and installing it"
        type: boolean
        default: false
      disk-run:
        description: "With from-disk: the run whose kept box to start from (empty: the newest a run on agentv kept)"
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
      iso-ref:
        type: string
        default: agentv
      pkgs-ref:
        type: string
        default: main
      packages:
        type: string
        default: build
      update-test:
        type: boolean
        default: true
      update-checks:
        type: string
        default: ""
      nightly:
        type: boolean
        default: false
      keep-iso:
        type: boolean
        default: false
      keep-disk:
        type: boolean
        default: false
      from-disk:
        type: boolean
        default: false
    secrets:
      AGENTV_SIGNING_KEY:
        required: true

permissions:
  contents: write

jobs:
  image:
    name: "Layer 5: ISO, install, boot, image checks"
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          path: os
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-pkgs
          ref: ${{ inputs.pkgs-ref }}
          path: pkgs
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/agentv-iso
          ref: ${{ inputs.iso-ref }}
          path: iso
          submodules: recursive
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.update-test && inputs.update-checks != ''
        with:
          repository: ${{ github.repository_owner }}/agentv-iso
          ref: ${{ inputs.update-checks }}
          path: iso-next
          submodules: recursive
          persist-credentials: false

      - name: Make room on the disk
        run: |
          avail() { df -BG --output=avail / | tail -1 | tr -dc 0-9; }
          if (( $(avail) < 45 )); then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
              /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/boost
            sudo docker image prune -af >/dev/null
          fi
          echo "Free: $(avail) GB"
          (( $(avail) >= 40 )) || { echo "::error::only $(avail) GB free, the build and install test need about 40 GB"; exit 1; }

      - name: AgenTV's packages for the ISO
        env:
          PACKAGES: ${{ inputs.packages }}
          AGENTV_SIGNING_KEY: ${{ secrets.AGENTV_SIGNING_KEY }}
        run: |
          dest=iso/configs/airootfs/usr/share/agentv-iso/packages
          if [[ $PACKAGES == "build" ]]; then
            sha=$(git -C os rev-parse HEAD)
            mkdir -p repo
            docker run --rm -v "$PWD/pkgs:/src" -v "$PWD/repo:/repo" \
              -e AGENTV_SIGNING_KEY -e AGENTV_CHANNEL=edge -e AGENTV_REF="commit=$sha" \
              -e AGENTV_SOURCE="https://github.com/$OWNER/agentv-os.git" \
              -e AGENTV_REPO_URL="https://github.com/$OWNER/agentv-pkgs/releases/download" \
              ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
            mkdir -p "$dest"
            cp repo/agentv-*.pkg.tar.zst "$dest/"
          else
            AGENTV_OWNER="$OWNER" iso/bin/agentv-iso-packages "$PACKAGES" "$dest"
          fi
          ls -l "$dest"

      # Something newer to update to: the same commit with pkgrel 99, signed,
      # in a repository the VM reaches through QEMU's network.
      - name: A newer agentv for the update test (S0.5)
        id: update
        if: inputs.update-test
        env:
          AGENTV_SIGNING_KEY: ${{ secrets.AGENTV_SIGNING_KEY }}
          UPDATE_CHECKS: ${{ inputs.update-checks }}
        run: |
          sha=$(git -C os rev-parse HEAD)
          update=iso/test-runs/update-repo
          mkdir -p "$update"
          docker run --rm -v "$PWD/pkgs:/src" -v "$PWD/$update:/repo" \
            -e AGENTV_SIGNING_KEY -e AGENTV_CHANNEL=edge -e AGENTV_REF="commit=$sha" -e AGENTV_PKGREL=99 \
            -e AGENTV_SOURCE="https://github.com/$OWNER/agentv-os.git" \
            -e AGENTV_REPO_URL="https://github.com/$OWNER/agentv-pkgs/releases/download" \
            ghcr.io/archlinux/archlinux:latest /src/bin/build /repo
          version=$(find "$update" -maxdepth 1 -name 'agentv-[0-9]*-99-any.pkg.tar.zst' -printf '%f\n' |
            sed -E 's/^agentv-(.*)-any\.pkg\.tar\.zst$/\1/')
          echo "version=$version" >>"$GITHUB_OUTPUT"
          # With update-checks, only the step that runs those checks gets the
          # repository, so iso-ref's own update checks stand down.
          if [[ -z $UPDATE_CHECKS ]]; then
            echo "AGENTV_TEST_UPDATE_REPO=/w/test-runs/update-repo" >>"$GITHUB_ENV"
            echo "AGENTV_TEST_UPDATE_VERSION=$version" >>"$GITHUB_ENV"
          fi

      - name: The night's installed box
        id: disk
        if: inputs.from-disk
        env:
          DISK_RUN: ${{ inputs.disk-run }}
        run: |
          if [[ -n $DISK_RUN ]]; then
            query="actions/runs/$DISK_RUN/artifacts?name=installed-disk"
            pick='.artifacts'
          else
            query="actions/artifacts?name=installed-disk&per_page=30"
            pick='[.artifacts[] | select(.workflow_run.head_branch == "agentv")]'
          fi
          id=$(gh api "repos/$GITHUB_REPOSITORY/$query" --jq "$pick | map(select(.expired | not)) | sort_by(.created_at) | last | .id // empty")
          if [[ -z $id ]]; then
            echo "There's no installed box from a night's run to start from, so this run builds the ISO and installs it." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p iso/test-runs/night-disk
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" >disk.zip
          unzip -q disk.zip -d iso/test-runs/night-disk
          rm disk.zip
          echo "found=true" >>"$GITHUB_OUTPUT"
          echo "This run starts from the box a night's run installed ($(cat iso/test-runs/night-disk/iso-name)), with this commit's packages put on it." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build, install, boot, check
        env:
          AGENTV_TEST_TESTED_OUT: ${{ inputs.nightly && '/w/test-runs/tested-packages.txt' || '' }}
          AGENTV_TEST_KEEP_DISK: ${{ inputs.keep-disk && '/w/test-runs/installed-disk' || '' }}
          FROM_DISK: ${{ steps.disk.outputs.found }}
        run: |
          set -o pipefail
          if [[ $FROM_DISK == "true" ]]; then
            iso/test/agentv/image/ci --from-disk iso/test-runs/night-disk 2>&1 | tee image.log
          else
            iso/test/agentv/image/ci 2>&1 | tee image.log
          fi

      # The same ISO and installed box, lent to update-checks' harness for its
      # update checks, then handed back for the steps after this one.
      - name: The update, checked as the version it updates to does (S0.5, S2.12)
        if: inputs.update-test && inputs.update-checks != ''
        env:
          AGENTV_TEST_UPDATE_REPO: /w/test-runs/update-repo
          AGENTV_TEST_UPDATE_VERSION: ${{ steps.update.outputs.version }}
          UPDATE_CHECKS: ${{ inputs.update-checks }}
        run: |
          set -o pipefail
          mv iso/test-runs iso-next/test-runs
          mv iso/release iso-next/release
          trap 'mv iso-next/test-runs iso/test-runs; mv iso-next/release iso/release' EXIT
          echo "The update to agentv $AGENTV_TEST_UPDATE_VERSION, checked with agentv-iso $UPDATE_CHECKS" | tee -a "$GITHUB_STEP_SUMMARY"
          iso-next/test/agentv/image/ci --again s0.5-update update-tv 2>&1 | tee -a image.log

      # Only a night where every check passed becomes tested.json.
      - name: Sign and publish tested.json
        if: inputs.nightly
        env:
          AGENTV_SIGNING_KEY: ${{ secrets.AGENTV_SIGNING_KEY }}
        run: |
          list=iso/test-runs/tested-packages.txt
          test -s "$list"
          jq -Rn --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg run "$GITHUB_RUN_ID" '
            [inputs | select(length > 0) | split(" ") | {key: .[0], value: .[1]}] | from_entries as $packages
            | {schema: 1, date: $date, run: $run,
               agentv: $packages.agentv, omarchy: $packages.omarchy, packages: $packages}
          ' <"$list" >tested.json
          export GNUPGHOME=$(mktemp -d)
          printf '%s\n' "$AGENTV_SIGNING_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --detach-sign --output tested.json.sig tested.json
          rm -rf "$GNUPGHOME"
          if ! gh release view tested -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create tested -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Tested by the nightly run" \
              --notes "tested.json lists every package version AgenTV's nightly run passed with. Boxes take an update only when it matches (ADR-026)."
          fi
          gh release upload tested -R "$GITHUB_REPOSITORY" --clobber tested.json tested.json.sig
          jq '{date, agentv, omarchy, packages: (.packages | length)}' tested.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: A box takes tonight's list, and holds back anything else (S0.7)
        if: inputs.nightly
        env:
          AGENTV_TEST_TESTED_LIVE: "1"
        run: set -o pipefail; iso/test/agentv/image/ci --again s0.7-tested 2>&1 | tee -a image.log

      # The name people download (ADR-027): the channel its packages came
      # from, the day and the agentv-os commit. At about 6.4 GB the ISO is
      # over the 2 GiB cap for release assets, so it stays a workflow artifact.
      - name: Name the ISO
        if: success() && inputs.keep-iso
        id: name
        env:
          PACKAGES: ${{ inputs.packages }}
        run: |
          name="agentv-$PACKAGES-$(date -u +%Y.%m.%d)-$(git -C os rev-parse --short=7 HEAD)-x86_64"
          mv iso/release/*.iso "iso/release/$name.iso"
          (cd iso/release && sha256sum "$name.iso" >"$name.iso.sha256")
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "ISO: \`$name.iso\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the ISO
        if: success() && inputs.keep-iso
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.name.outputs.name }}
          path: |
            iso/release/*.iso
            iso/release/*.iso.sha256
          compression-level: 0
          retention-days: 7

      # The installed box, for the runs that start from it. A few GB even
      # compressed, so it's kept for three days: a night's run makes a new one.
      - name: Keep the installed box
        if: success() && inputs.keep-disk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installed-disk
          path: iso/test-runs/installed-disk/
          compression-level: 0
          retention-days: 3

      - name: Acceptance ids
        if: always()
        run: |
          result() {
            if grep -q "not ok - $1 " image.log 2>/dev/null; then echo fail
            elif grep -q "^ok - $1 " image.log 2>/dev/null; then echo pass
            else echo "not run"; fi
          }
          os/test/agentv/report image \
            "S0.1=$(result S0.1)" "S0.4=$(result S0.4)" "S0.5=$(result S0.5)" "S0.7=$(result S0.7)" \
            "S1.1=$(result S1.1)" "S1.3=$(result S1.3)" "S1.6=$(result S1.6)" "S1.7=$(result S1.7)" \
            "S2.14=$(result S2.14)" "S2.15=$(result S2.15)" "S2.16=$(result S2.16)" "S2.17=$(result S2.17)" "S2.18=$(result S2.18)" "S2.19=$(result S2.19)" \
            "S3.3=$(result S3.3)" "S3.6=$(result S3.6)" "S3.8=$(result S3.8)" "S3.9=$(result S3.9)" "S3.10=$(result S3.10)" \
            "S4.4=$(result S4.4)" "S4.5=$(result S4.5)" "S4.6=$(result S4.6)" \
            >>"$GITHUB_STEP_SUMMARY"

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ inputs.packages }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            image.log
            tested.json
            iso/test-runs/*/*.png
            iso/test-runs/*/serial.log
            iso/test-runs/*/omarchy-install.log
            iso/test-runs/*/runs/**/*.png
            iso/test-runs/*/runs/**/*.txt
            iso/test-runs/*/runs/**/*.json
            iso/test-runs/*/runs/**/*.log
          if-no-files-found: ignore
          retention-days: 14
