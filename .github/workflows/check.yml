name: Check

# AgenTV's fast gates (ADR-019, layers 1 and 2) on every pull request and every
# push to agentv: Omarchy's files unchanged since .github/omarchy-base, no em
# dashes, no secrets, no service automation, no owner in code, shellcheck,
# AgenTV's unit tests, and Omarchy's own tests no worse than at the base.
# Other workflows reuse it.

on:
  pull_request:
  push:
    branches: [agentv]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  policy:
    name: "Layer 1: policy, lint and secrets"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Full history, no file contents until needed: the gate compares trees
      # with the base and reads only the files AgenTV added.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install shellcheck and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          type -P shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          shellcheck --version | head -2
          gitleaks version

      - name: The fast gate
        run: bin/agentv-check --ci --fetch-base

      - name: The gate catches what it should
        run: test/agentv/policy/check-test.sh --ci

  unit:
    name: "Layer 2: unit tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: test/agentv/unit/run

  omarchy-tests:
    name: "Omarchy's own tests, no worse than at the base"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # On Arch, where Omarchy runs, as an ordinary user. Nothing here has a
      # desktop, so the tests that need one fail at the base too; the script
      # only fails on a test that gets worse.
      - name: Run Omarchy's suites at the base and here
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/archlinux/archlinux:latest bash -euo pipefail -c '
            sed -i "1i Server = https://mirror.omarchy.org/\$repo/os/\$arch" /etc/pacman.d/mirrorlist
            for attempt in 1 2 3; do
              pacman -Syu --noconfirm --needed git jq nodejs lua python ripgrep fd perl diffutils which >/dev/null && break
              [ "$attempt" -lt 3 ] || { echo "::error::the test container could not install its tools"; exit 1; }
              sleep 15
            done
            useradd -m tester
            cp -r /src /home/tester/agentv-os
            chown -R tester /home/tester/agentv-os
            cd /home/tester/agentv-os
            setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester bash -c "
              git config --global --add safe.directory /home/tester/agentv-os
              test/agentv/omarchy-tests
            "
          '

  report:
    name: Acceptance ids
    if: always()
    needs: [policy, unit, omarchy-tests]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report
        env:
          POLICY: ${{ needs.policy.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          case "$POLICY" in
            success) s04="pass (no Omarchy file edited; the logo is checked in agentv-iso)" ;;
            *) s04="fail (layer 1: $POLICY)" ;;
          esac
          case "$UNIT" in
            success)
              s06="pass (unit: the sync's decisions; the live sync runs in omarchy-sync)"
              s07="pass (unit: holding back; the live check runs in nightly)"
              ;;
            *) s06="fail (layer 2: $UNIT)"; s07="fail (layer 2: $UNIT)" ;;
          esac
          test/agentv/report check "S0.4=$s04" "S0.6=$s06" "S0.7=$s07" >>"$GITHUB_STEP_SUMMARY"
