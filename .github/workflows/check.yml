name: Check

# AgenTV's fast gates (ADR-019, layers 1 and 2) on every pull request and every
# push to agentv: Omarchy's files unchanged since .github/omarchy-base, no em
# dashes, no secrets, no service automation, no owner in code, shellcheck,
# AgenTV's unit tests, and Omarchy's own tests no worse than at the base.
# A pull request that changes what the box installs, runs or migrates also
# gets the image layer (layer 5). Other workflows reuse it.

on:
  pull_request:
  push:
    branches: [agentv]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  policy:
    name: "Layer 1: policy, lint and secrets"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      # Full history, no file contents until needed: the gate compares trees
      # with the base and reads only the files AgenTV added.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Install shellcheck and gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          type -P shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          curl -fsSLo /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          shellcheck --version | head -2
          gitleaks version

      - name: The fast gate
        run: bin/agentv-check --ci --fetch-base

      - name: The gate catches what it should
        run: test/agentv/policy/check-test.sh --ci

  unit:
    name: "Layer 2: unit tests"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --version
      # Music reads tags and covers with ffprobe and ffmpeg, as the box does.
      - name: ffmpeg, for the Music tests
        run: type -P ffprobe >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg; }
      - name: The daemon's TypeScript type-checks
        run: test/agentv/types
      - run: test/agentv/unit/run

  contract:
    name: "Layer 3: every app against its fixtures"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Music's fixture folder is read with ffprobe and ffmpeg, as on the box.
      - name: ffmpeg, for Music's fixture folder
        run: type -P ffprobe >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends ffmpeg; }
      - name: The built-ins and the test apps, each in its own worker, with its page in Chromium
        run: test/agentv/contract/run

  ui:
    name: "Layer 4: the launcher in Chromium"
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The launcher, in a headless Chromium at 1920 × 1080
        run: test/agentv/ui/run

  omarchy-tests:
    name: "Omarchy's own tests, no worse than at the base"
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # On Arch, where Omarchy runs, as an ordinary user. Nothing here has a
      # desktop, so the tests that need one fail at the base too; the script
      # only fails on a test that gets worse.
      - name: Run Omarchy's suites at the base and here
        run: |
          docker run --rm -v "$PWD:/src:ro" ghcr.io/archlinux/archlinux:latest bash -euo pipefail -c '
            sed -i "1i Server = https://mirror.omarchy.org/\$repo/os/\$arch" /etc/pacman.d/mirrorlist
            for attempt in 1 2 3; do
              pacman -Syu --noconfirm --needed git jq nodejs lua python ripgrep fd perl diffutils which >/dev/null && break
              [ "$attempt" -lt 3 ] || { echo "::error::the test container could not install its tools"; exit 1; }
              sleep 15
            done
            useradd -m tester
            cp -r /src /home/tester/agentv-os
            chown -R tester /home/tester/agentv-os
            cd /home/tester/agentv-os
            setpriv --reuid=tester --regid=tester --init-groups env HOME=/home/tester bash -c "
              git config --global --add safe.directory /home/tester/agentv-os
              test/agentv/omarchy-tests
            "
          '

  # ADR-019: install/, system/, config/hypr/, migrations/, the TV session
  # (session/) and its daemon (daemon/) change the box itself, so a pull
  # request touching them gets the image layer too. Not a fork's, which gets
  # no signing key, and not a sync pull request, which omarchy-sync.yml
  # already runs the image layer for.
  #
  # A change that needs new image checks or a new PKGBUILD goes in a branch
  # of the same name in agentv-iso or agentv-pkgs, and the image layer uses
  # those when they're there, so the three are tested together before any
  # of them merges.
  changes:
    name: Does this need the image layer
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.paths.outputs.image }}
      iso-ref: ${{ steps.pair.outputs.iso-ref }}
      pkgs-ref: ${{ steps.pair.outputs.pkgs-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: paths
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          # The checkout is the pull request merged into its base, so its
          # first parent is the base.
          changed=$(git diff --name-only HEAD^1 HEAD -- install/ system/ config/hypr/ migrations/ session/ daemon/)
          image=false
          if [[ -z $changed ]]; then
            why="nothing under install/, system/, config/hypr/, migrations/, session/ or daemon/ changed"
          elif [[ $HEAD_REPO != "$GITHUB_REPOSITORY" ]]; then
            why="it's from a fork, which gets no signing key"
          elif [[ $HEAD_REF == omarchy-sync/* ]]; then
            why="it's an Omarchy sync, and omarchy-sync.yml runs the image layer for it"
          else
            image=true
          fi
          echo "image=$image" >>"$GITHUB_OUTPUT"
          if [[ $image == true ]]; then
            echo "The image layer runs: $(wc -l <<<"$changed") changed files under install/, system/, config/hypr/, migrations/, session/ or daemon/." >>"$GITHUB_STEP_SUMMARY"
          else
            echo "No image layer, because $why." >>"$GITHUB_STEP_SUMMARY"
          fi
      - id: pair
        env:
          HEAD_REF: ${{ github.head_ref }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for repo in iso pkgs; do
            default=agentv
            [[ $repo == pkgs ]] && default=main
            ref=$default
            if git ls-remote --exit-code --heads "https://github.com/$OWNER/agentv-$repo.git" "$HEAD_REF" >/dev/null 2>&1; then
              ref=$HEAD_REF
              echo "agentv-$repo: its branch $HEAD_REF, made for this change." >>"$GITHUB_STEP_SUMMARY"
            fi
            echo "$repo-ref=$ref" >>"$GITHUB_OUTPUT"
          done
  image:
    needs: changes
    if: needs.changes.outputs.image == 'true'
    # image.yml asks for contents: write, for the nightly run's tested.json.
    # A pull request's run never publishes it.
    permissions:
      contents: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      iso-ref: ${{ needs.changes.outputs.iso-ref }}
      pkgs-ref: ${{ needs.changes.outputs.pkgs-ref }}
      packages: build
      update-test: true
    secrets: inherit

  report:
    name: Acceptance ids
    if: always()
    needs: [policy, unit, contract, ui, omarchy-tests]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Report
        env:
          POLICY: ${{ needs.policy.result }}
          UNIT: ${{ needs.unit.result }}
          CONTRACT: ${{ needs.contract.result }}
          UI: ${{ needs.ui.result }}
        run: |
          case "$POLICY" in
            success) s04="pass (no Omarchy file edited; the logo is checked in agentv-iso)" ;;
            *) s04="fail (layer 1: $POLICY)" ;;
          esac
          case "$UNIT" in
            success)
              s06="pass (unit: the sync's decisions; the live sync runs in omarchy-sync)"
              s07="pass (unit: holding back; the live check runs in nightly)"
              s21="pass (unit: agentv app install from a signed test index)"
              s22="pass (unit: agentv app validate)"
              ;;
            *) s06="fail (layer 2: $UNIT)"; s07="fail (layer 2: $UNIT)"; s21="fail (layer 2: $UNIT)"; s22="fail (layer 2: $UNIT)" ;;
          esac
          case "$UI" in
            success)
              s23="pass (layer 4: every tile reached with the arrows)"
              s24="pass (layer 4: a dragged tile lands where it was dropped and is still there after the daemon starts again; the image layer reboots)"
              s25="pass (layer 4: +/-, the corner and the size bar give only the app's sizes)"
              s26="pass (layer 4: covered tiles move to the next free cells; no room can't be picked)"
              s27="pass (layer 4: no tier on tiles; details say who made each app)"
              s212="pass (layers 2 and 4: the check, Settings → Updates, What's new and Install now)"
              s213="pass (layer 4: one toast per release, and the bar's notice)"
              ;;
            *)
              s23="fail (layer 4: $UI)"; s24="fail (layer 4: $UI)"; s25="fail (layer 4: $UI)"; s26="fail (layer 4: $UI)"; s27="fail (layer 4: $UI)"
              s212="fail (layer 4: $UI)"; s213="fail (layer 4: $UI)"
              ;;
          esac
          [[ $UNIT == "success" ]] || s212="fail (layer 2: $UNIT)"
          if [[ $UNIT == "success" && $UI == "success" ]]; then
            s33="pass (layers 2 and 4: a row within 10 s of an app opening, read from its page in Chromium; one row per viewer; the live box is the image layer's)"
            s36="pass (layers 2 and 4: the fixture album in every format, from a folder, a USB stick and a share through stand-ins for udisks2, gvfs and mpv; the page and tiles in Chromium; the real stick and NAS are the NUC's)"
            s38="pass (layers 2 and 4: MET's symbol and the wind to a scene, from recorded replies; the live tile is the image layer's and the NUC's)"
            s39="pass (layers 2 and 4: today, tomorrow and seven days from recorded replies; the live tiles are the image layer's and the NUC's)"
            s310="pass (layers 2 and 4: the medium continue tile from the ledger, drawn with how far in; an entry opens through playback.open)"
          else
            s33="fail (layer 2: $UNIT, layer 4: $UI)"
            s36="fail (layer 2: $UNIT, layer 4: $UI)"
            s38="fail (layer 2: $UNIT, layer 4: $UI)"
            s39="fail (layer 2: $UNIT, layer 4: $UI)"
            s310="fail (layer 2: $UNIT, layer 4: $UI)"
          fi
          # S3.1 here is every app in this repo; the official apps and the
          # private reference adapter run the same runner in their own repos.
          if [[ $CONTRACT == "success" && $UNIT == "success" ]]; then
            s31="pass (layer 3: the built-ins and the test apps, each against its fixtures; the official apps and the private reference adapter in their own repos once they exist)"
          else
            s31="fail (layer 3: $CONTRACT, layer 2: $UNIT)"
          fi
          test/agentv/report check "S0.4=$s04" "S0.6=$s06" "S0.7=$s07" "S2.1=$s21" "S2.2=$s22" "S2.3=$s23" "S2.4=$s24" "S2.5=$s25" "S2.6=$s26" "S2.7=$s27" \
            "S2.12=$s212" "S2.13=$s213" "S3.1=$s31" "S3.3=$s33" "S3.6=$s36" "S3.8=$s38" "S3.9=$s39" "S3.10=$s310" >>"$GITHUB_STEP_SUMMARY"
