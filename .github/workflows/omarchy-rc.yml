name: Omarchy release candidate

# Twice a week: when Omarchy has a release candidate for a release newer than
# the one AgenTV sits on, a box tries the move to it (ADR-085). Omarchy tags
# a candidate weeks before the final release, and the daily sync never counts
# one, so without this the first AgenTV hears of a new Omarchy is the day it
# ships.
#
# What it checks is the image layer's omarchy-update check: the night's
# installed box takes the newer agentv, then Omarchy's update from the rc
# channel, from the TV, and Restart and Shut down still work on it. The other
# image checks run on the Omarchy the box was installed with, which the
# nightly run covers, so they'd say nothing about the candidate.
#
# It only reports. It publishes nothing and keeps nothing: no tested.json,
# no ISO, no box in the cache. It never moves .github/omarchy-base and never
# opens a pull request. That stays the sync's job once the release is out.
# A run with nothing to try says so in its summary and ends there. A failed
# run opens an issue, or adds to the one that candidate has, and a run that
# passes closes it.
#
# The image workflow builds the newer agentv the box updates to, and signs
# it, so this run hands it the signing key, as every image run does today.
# It's the only secret it passes. Once the image workflow takes a test key
# for runs that publish nothing, this one should use that instead.

on:
  schedule:
    - cron: "41 3 * * 1,4"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release candidate to try, like v4.6.0-rc1 (empty: the newest)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: omarchy-rc
  cancel-in-progress: false

jobs:
  find:
    name: Is there a release candidate to try
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    outputs:
      run: ${{ steps.find.outputs.run }}
      tag: ${{ steps.find.outputs.tag }}
      version: ${{ steps.find.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false

      - id: find
        env:
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          [[ -z $TAG ]] || args+=(--tag "$TAG")
          .github/scripts/omarchy-rc ${args[@]+"${args[@]}"} | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: Move a box to it
    needs: find
    if: needs.find.outputs.run == 'true'
    # What the image workflow asks for, and a called workflow can't have more
    # than its caller: actions to throw away the box it cached for the run,
    # contents for tested.json, which only a nightly run publishes.
    permissions:
      contents: write
      actions: write
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ github.sha }}
      packages: edge
      update-test: true
      from-disk: true
      checks: omarchy-update
      shards: 1
      omarchy-channel: rc
      omarchy-version: ${{ needs.find.outputs.version }}
    secrets:
      AGENTV_SIGNING_KEY: ${{ secrets.AGENTV_SIGNING_KEY }}

  # One issue per candidate. A later run that fails on the same one adds a
  # comment instead of opening another.
  issue:
    name: Say what broke
    needs: [find, image]
    if: failure() && needs.find.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: legs

      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.find.outputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Omarchy $TAG didn't pass AgenTV's checks"
          {
            echo "Omarchy $TAG is a release candidate. A box couldn't move to it and come back working, so the final release will likely need work here before the daily sync can take it."
            echo
            echo "Nothing was published, and no box gets a candidate. This is only the early warning."
            echo
            .github/scripts/nightly-broke legs || echo "What broke couldn't be read from the logs."
            echo "Screenshots and logs: $RUN"
          } >body.md
          number=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number,title |
            jq -r --arg title "$title" '[.[] | select(.title == $title) | .number][0] // empty')
          if [[ -n $number ]]; then
            gh issue comment "$number" -R "$GITHUB_REPOSITORY" --body-file body.md
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --body-file body.md
          fi

  # A candidate that passes closes what earlier candidates' failures opened,
  # so the list only shows what's still broken.
  fixed:
    name: Say it's fixed
    needs: [find, image]
    if: success() && needs.find.outputs.run == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.find.outputs.tag }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"didn't pass AgenTV's checks\"" --json number,title |
            jq -r '.[] | select(.title | test("^Omarchy v[0-9.]+-rc[0-9]+ didn.t pass AgenTV.s checks$")) | .number' |
            while read -r number; do
              gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "A box moved to Omarchy $TAG and came back working: $RUN"
            done
