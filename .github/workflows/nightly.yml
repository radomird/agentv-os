name: Nightly

# Every night, the current AgenTV release on Omarchy's stable channel as it
# stands tonight goes through the whole image layer, including an update in
# place (S0.5). When everything passes, the run signs tested.json with every
# package and version on the box, and boxes take only those (ADR-026, S0.7).
# Until AgenTV has a stable release, it tests edge. A failure opens an issue,
# and the next night that passes closes it.
#
# It's also where the edge ISO is made, the way omarchy-iso's own nightly
# build makes Omarchy's: AgenTV's edge packages on Omarchy's stable channel,
# built from agentv-iso's agentv branch, kept as a workflow artifact when
# every check passes. Once there's a stable release, edge gets a run of its
# own beside it, and only the stable run signs tested.json.
#
# Each release is checked with agentv-iso as it was tagged with it, so the
# stable run doesn't hold a release to checks written for later work, such
# as a stage it doesn't have yet. Its update in place goes to tonight's
# agentv, so that update is checked with agentv-iso's agentv branch, the
# checks that go with what it updates to.
#
# The release's tag in agentv-iso is agentv-v1.0.0 from 1.0 on, and v0.2.0
# for a 0.x release (.github/scripts/release-checks). The run is handed the
# commit that tag is on, not its name. When agentv-iso has no tag for the
# release, the release is still checked, with agentv-iso's agentv branch,
# but the night fails and its issue says why: checked that way for long, a
# release would be held to checks for work it doesn't have.
#
# Edge is checked the same way, with the agentv-iso that goes with its
# package (.github/scripts/nightly-checks). agentv-pkgs' Build publishes
# edge on GitHub's schedule, which can run hours late, so on a busy day
# agentv-os has merged more by night, and agentv-iso the checks that came
# with it, which fail on the older package. Then edge's ISO is built and
# checked with agentv-iso as it was before those, and its update to
# tonight's agentv with agentv-iso's agentv branch. When edge's package is
# agentv-os's newest, that's agentv-iso's agentv branch for both.
#
# The release's checks run two VMs at a time, as edge's do. S1.3 times the
# switch back to the TV against a 10 s bar, and beside another VM (from
# 2026-10-27) that took 6 to 10 s instead of 3 to 5 s, so for a while the
# release's run had one VM at a time. agentv-iso fixed that in its own
# checks: with two VMs, its test/agentv/image/run holds S1.3 back and runs
# it on its own, with every CPU, once the rest are done. Every release from
# 0.2.0 on has that, so two VMs are safe for the release again.
#
# Edge's checks are shared out across four jobs, two VMs each, the way a
# pull request's are (image.yml). The release's run signs tested.json and
# checks its update with tonight's agentv-iso, so it stays in one job, and
# so does edge's on a night its update is checked with tonight's agentv-iso.
#
# Started by hand, it can take another agentv-iso ref for edge's checks
# (checks), so a fix to the checks can be seen in a full night before it
# merges. The release keeps its own. That ref isn't merged yet, so such a
# run never gets AgenTV's own key: it signs no tested.json, checks no
# update (a channel's box takes one signed with that key alone) and keeps no
# ISO.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      checks:
        description: "agentv-iso ref for edge's checks, in a run that signs nothing, checks no update and keeps no ISO (empty: agentv)"
        type: string
        default: ""

permissions:
  contents: write
  issues: write
  # The edge leg's checks are shared out across jobs (image.yml), and its
  # last job deletes the run's box, or the ISO when a check failed, and the
  # night's box and root image the cache no longer needs.
  actions: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  which:
    name: Which release to test
    runs-on: ubuntu-26.04
    outputs:
      runs: ${{ steps.which.outputs.runs }}
      untagged: ${{ steps.which.outputs.untagged }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          PKGS: ${{ github.repository_owner }}/agentv-pkgs
          CHECKS: ${{ inputs.checks }}
        run: |
          next=${CHECKS:-agentv}
          newest() {
            gh release view "$1" -R "$PKGS" --json assets --jq '.assets[].name' 2>/dev/null |
              sed -nE 's/^agentv-([0-9][^-]*)-[0-9]+-any\.pkg\.tar\.zst$/\1/p' | sort -V | tail -n 1
          }
          stable=$(newest stable)

          # Edge's package, and the agentv-iso that goes with it. A run
          # started with its own agentv-iso ref checks with that.
          edge=$(newest edge)
          edge_checks=$next
          edge_update=""
          if [[ -z $CHECKS ]]; then
            repos=("https://github.com/$GITHUB_REPOSITORY_OWNER/agentv-os.git" "https://github.com/$GITHUB_REPOSITORY_OWNER/agentv-iso.git")
            if GITHUB_OUTPUT="$RUNNER_TEMP/edge" .github/scripts/nightly-checks "$edge" "${repos[@]}"; then
              built=$(sed -n 's/^built=//p' "$RUNNER_TEMP/edge")
              edge_checks=$(sed -n 's/^checks=//p' "$RUNNER_TEMP/edge")
              newer=$(sed -n 's/^newer=//p' "$RUNNER_TEMP/edge")
              if [[ $edge_checks == "agentv" ]]; then
                echo "Edge's package is agentv $edge, from agentv-os ${built:0:9}, checked with agentv-iso agentv." >>"$GITHUB_STEP_SUMMARY"
              else
                edge_update=agentv
                echo "Edge's package is agentv $edge, from agentv-os ${built:0:9}. Since then agentv-os has merged $newer, with checks of their own, so edge is checked with agentv-iso ${edge_checks:0:9}, from before those, and its update to tonight's agentv with agentv-iso agentv." >>"$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::warning::The agentv-iso that goes with edge's package $edge couldn't be found, so edge is checked with agentv-iso agentv, which can have checks the package doesn't."
            fi
          fi

          if [[ -n $stable ]]; then
            # The agentv-iso the release was tagged with, as the commit its
            # tag is on. With no tag for it, tonight's checks stand in, and
            # the night says so out loud (the untagged job below).
            checks=$next
            with=$next
            found=0
            GITHUB_OUTPUT="$RUNNER_TEMP/release" .github/scripts/release-checks "$stable" \
              "https://github.com/$GITHUB_REPOSITORY_OWNER/agentv-iso.git" 2>"$RUNNER_TEMP/release.err" || found=$?
            if (( found == 0 )); then
              checks=$(sed -n 's/^checks=//p' "$RUNNER_TEMP/release")
              with="$(sed -n 's/^tag=//p' "$RUNNER_TEMP/release") (${checks:0:9})"
            elif (( found == 3 )); then
              why=$(sed 's/^release-checks: //' "$RUNNER_TEMP/release.err")
              untagged="AgenTV $stable is the stable release, and $why. So tonight it was checked with agentv-iso's agentv branch, which has checks for work the release doesn't have. Tag agentv-iso for the release, on the commit it was built from."
              echo "untagged=$untagged" >>"$GITHUB_OUTPUT"
              echo "::warning::$untagged"
            else
              cat "$RUNNER_TEMP/release.err" >&2
              echo "::error::Couldn't find out which agentv-iso AgenTV $stable was tagged with, so nothing is tested tonight."
              exit 1
            fi
            update=""
            [[ $checks == "$next" ]] || update=$next
            runs=$(jq -cn --arg checks "$checks" --arg update "$update" --arg edge "$edge_checks" --arg edge_update "$edge_update" '[{packages: "stable", tested: true, iso: false, checks: $checks, update: $update, lanes: 2},
              {packages: "edge", tested: false, iso: true, checks: $edge, update: $edge_update, lanes: 2}]')
            echo "Testing AgenTV's stable release $stable with agentv-iso $with, two VMs at a time with S1.3 on its own, and making the edge ISO with agentv-iso $edge_checks" >>"$GITHUB_STEP_SUMMARY"
          else
            runs=$(jq -cn --arg edge "$edge_checks" --arg edge_update "$edge_update" '[{packages: "edge", tested: true, iso: true, checks: $edge, update: $edge_update, lanes: 2}]')
            echo "Testing AgenTV's edge release (there's no stable one yet) with agentv-iso $edge_checks, and making the edge ISO" >>"$GITHUB_STEP_SUMMARY"
          fi
          if [[ -n $CHECKS ]]; then
            echo "Started by hand with agentv-iso $CHECKS, so this run has no signing key: it signs no tested.json, checks no update and keeps no ISO." >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "runs=$runs" >>"$GITHUB_OUTPUT"

  image:
    name: Install and test ${{ matrix.packages }}
    needs: which
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.which.outputs.runs) }}
    uses: ./.github/workflows/image.yml
    with:
      ref: agentv
      iso-ref: ${{ matrix.checks }}
      packages: ${{ matrix.packages }}
      # A run started by hand with its own agentv-iso ref (checks) has no
      # key, so it has nothing to sign an update or tested.json with, and
      # its ISO isn't one to keep.
      update-test: ${{ inputs.checks == '' }}
      update-checks: ${{ matrix.update }}
      nightly: ${{ matrix.tested && inputs.checks == '' }}
      keep-iso: ${{ matrix.iso && inputs.checks == '' }}
      # The night's box is what later runs start from, so it's never one
      # that ran an agentv-iso ref someone typed in either.
      keep-disk: ${{ matrix.iso && inputs.checks == '' }}
      lanes: ${{ matrix.lanes }}
      # The one caller that signs with AgenTV's own key: what a channel's
      # box updates to, and tested.json. image.yml reads it in its jobs in
      # the "release" environment, which only agentv may use, so nothing is
      # handed over here. Never beside an agentv-iso ref someone typed in.
      release-key: ${{ inputs.checks == '' }}

  # A release with no tag in agentv-iso was checked with tonight's checks.
  # That's said by failing the night, so it's in the issue below and not
  # only in a summary nobody reads.
  untagged:
    name: The release's own checks weren't found
    needs: which
    if: needs.which.outputs.untagged != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          UNTAGGED: ${{ needs.which.outputs.untagged }}
        run: |
          echo "$UNTAGGED" >>"$GITHUB_STEP_SUMMARY"
          echo "::error::$UNTAGGED"
          exit 1

  # The issue names each failed leg's failed checks and the line that says
  # why, from the legs' logs (.github/scripts/nightly-broke).
  issue:
    name: Say what broke
    needs: [which, image, untagged]
    if: failure()
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          pattern: image-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: legs

      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UNTAGGED: ${{ needs.which.outputs.untagged }}
          IMAGE: ${{ needs.image.result }}
        run: |
          {
            if [[ -n $UNTAGGED ]]; then
              echo "$UNTAGGED"
              echo
            fi
            if [[ $IMAGE == "success" ]]; then
              echo "Every image check passed otherwise."
            else
              echo "An image run failed tonight, so tested.json, the edge ISO or both weren't updated. Boxes stay where they are."
              echo
              .github/scripts/nightly-broke legs || echo "What broke couldn't be read from the logs."
            fi
            echo "Screenshots and logs: $RUN"
          } >body.md
          gh issue create -R "$GITHUB_REPOSITORY" --title "Nightly run failed on $(date -u +%Y-%m-%d)" --body-file body.md

  # A night that passes closes the issues earlier failures opened, so the
  # list only ever shows what's still broken.
  fixed:
    name: Say it's fixed
    needs: [image, untagged]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.untagged.result == 'skipped' }}
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly run failed on"' \
            --json number,title --jq '.[] | select(.title | startswith("Nightly run failed on ")) | .number' |
            while read -r number; do
              gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "Tonight's run passed, with every image check: $RUN"
            done
