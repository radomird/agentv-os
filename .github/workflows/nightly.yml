name: Nightly

# Every night, the current AgenTV release on Omarchy's stable channel as it
# stands tonight goes through the whole image layer, including an update in
# place (S0.5). When everything passes, the run signs tested.json with every
# package and version on the box, and boxes take only those (ADR-026, S0.7).
# Until AgenTV has a stable release, it tests edge. A failure opens an issue,
# and the next night that passes closes it.
#
# It's also where the edge ISO is made, the way omarchy-iso's own nightly
# build makes Omarchy's: AgenTV's edge packages on Omarchy's stable channel,
# built from agentv-iso's agentv branch, kept as a workflow artifact when
# every check passes. Once there's a stable release, edge gets a run of its
# own beside it, and only the stable run signs tested.json.
#
# Each release is checked with agentv-iso as it was tagged with it, so the
# stable run doesn't hold a release to checks written for later work, such
# as a stage it doesn't have yet. Its update in place goes to tonight's
# agentv, so that update is checked with agentv-iso's agentv branch, the
# checks that go with what it updates to. Edge is checked with agentv-iso's
# agentv branch.

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  which:
    name: Which release to test
    runs-on: ubuntu-26.04
    outputs:
      runs: ${{ steps.which.outputs.runs }}
    steps:
      - id: which
        env:
          GH_TOKEN: ${{ github.token }}
          PKGS: ${{ github.repository_owner }}/agentv-pkgs
        run: |
          stable=$(gh release view stable -R "$PKGS" --json assets --jq '.assets[].name' 2>/dev/null |
            sed -nE 's/^agentv-([0-9][^-]*)-[0-9]+-any\.pkg\.tar\.zst$/\1/p' | sort -V | tail -n 1)
          if [[ -n $stable ]]; then
            checks=agentv
            if git ls-remote --exit-code --tags "https://github.com/$GITHUB_REPOSITORY_OWNER/agentv-iso.git" "refs/tags/v$stable" >/dev/null 2>&1; then
              checks="v$stable"
            fi
            update=""
            [[ $checks == "agentv" ]] || update=agentv
            runs=$(jq -cn --arg checks "$checks" --arg update "$update" '[{packages: "stable", tested: true, iso: false, checks: $checks, update: $update},
              {packages: "edge", tested: false, iso: true, checks: "agentv", update: ""}]')
            echo "Testing AgenTV's stable release $stable with agentv-iso $checks, and making the edge ISO" >>"$GITHUB_STEP_SUMMARY"
          else
            runs='[{"packages":"edge","tested":true,"iso":true,"checks":"agentv","update":""}]'
            echo "Testing AgenTV's edge release (there's no stable one yet), and making the edge ISO" >>"$GITHUB_STEP_SUMMARY"
          fi
          echo "runs=$runs" >>"$GITHUB_OUTPUT"

  image:
    needs: which
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.which.outputs.runs) }}
    uses: ./.github/workflows/image.yml
    with:
      ref: agentv
      iso-ref: ${{ matrix.checks }}
      packages: ${{ matrix.packages }}
      update-test: true
      update-checks: ${{ matrix.update }}
      nightly: ${{ matrix.tested }}
      keep-iso: ${{ matrix.iso }}
      keep-disk: ${{ matrix.iso }}
    secrets: inherit

  issue:
    name: Say what broke
    needs: image
    if: failure()
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue create -R "$GITHUB_REPOSITORY" --title "Nightly run failed on $(date -u +%Y-%m-%d)" \
            --body "An image run failed tonight, so tested.json, the edge ISO or both weren't updated. Boxes stay where they are. Screenshots and logs: $RUN"

  # A night that passes closes the issues earlier failures opened, so the
  # list only ever shows what's still broken.
  fixed:
    name: Say it's fixed
    needs: image
    if: success()
    runs-on: ubuntu-26.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Nightly run failed on"' \
            --json number,title --jq '.[] | select(.title | startswith("Nightly run failed on ")) | .number' |
            while read -r number; do
              gh issue close "$number" -R "$GITHUB_REPOSITORY" --comment "Tonight's run passed, with every image check: $RUN"
            done
