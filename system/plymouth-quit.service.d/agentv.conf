# AgenTV (ADR-060): straight to the TV. The boot splash stays up through
# first boot's work, such as its one-time rebuild of the boot image. Then
# Plymouth lets go of the screen but leaves its last frame on it
# (bin/agentv-boot-splash quit), so the TV session takes over from the splash
# itself, with no console text or black screen between them. The login
# manager starts after this, as it always has.

[Unit]
After=agentv-firstboot.service

[Service]
ExecStart=
ExecStart=-/usr/bin/agentv-boot-splash quit
