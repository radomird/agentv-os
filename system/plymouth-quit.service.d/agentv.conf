# AgenTV (ADR-060): straight to the TV. The boot splash stays up through
# first boot's work, such as its one-time rebuild of the boot image, and as
# Plymouth quits it leaves its last frame on the screen, so the TV session
# takes over from the splash itself, with no console text or black screen
# between them. bin/agentv-boot-splash quit decides, by the boot switch.
# The login manager starts after this, as it always has.

[Unit]
After=agentv-firstboot.service

[Service]
ExecStart=
ExecStart=-/usr/bin/agentv-boot-splash quit
