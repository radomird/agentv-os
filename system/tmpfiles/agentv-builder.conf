# The builder's folders (ADR-011, ADR-045). Builds live under
# /var/lib/agentv/build, each app's folder root's and each version's the
# builder's and its group's, closed to everyone else (root's hand-over makes
# it 0750). The builder's home holds the provider's CLI and, on a plan, the
# CLI's own sign-in, and only the builder reads it. Root's tickets for the
# running build are in /run/agentv-build. The apps and themes folders are
# there before the first app or theme is, since root's hand-over installs
# approved builds into them, and anyone may read a theme there (S6.4).
# /etc/agentv/env, root's alone, is there even before a key is, for the
# relay's credential.
d /var/lib/agentv 0755 root root -
d /var/lib/agentv/build 0755 root root -
d /var/lib/agentv/apps 0755 root root -
d /var/lib/agentv/themes 0755 root root -
d /var/lib/agentv/builder 0700 agentv-builder agentv-builder -
# In the builder's home, the folders a build and the voice router see
# read-only or keep writable (agentv-builder@.service): they're here from
# the start, so a unit's line for one is never skipped for want of the
# folder. The CLI's own settings file starts empty, and a build can't put a
# hook in it.
d /var/lib/agentv/builder/.local 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.local/bin 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.local/share 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.local/share/mise 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.local/state 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.local/state/mise 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.config 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.config/mise 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.config/muse 0755 agentv-builder agentv-builder -
d /var/lib/agentv/builder/.claude 0700 agentv-builder agentv-builder -
f /var/lib/agentv/builder/.claude/settings.json 0600 agentv-builder agentv-builder - {}
d /run/agentv-build 0755 root root -
d /etc/agentv 0755 root root -
f /etc/agentv/env 0600 root root -
