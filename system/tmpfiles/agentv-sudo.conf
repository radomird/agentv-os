# AgenTV's own short sudo grants: the one an update from the TV runs with
# (bin/agentv-update-tv), and the one first boot's splash runs with
# (install/tv/branding.sh). Each one goes as soon as it's done. If the power
# goes out first, this takes it away at the next boot. The boot-only "r!"
# means a later tmpfiles run never removes one that's in use.
r! /etc/sudoers.d/99-agentv-update-*
r! /etc/sudoers.d/99-agentv-branding-*
