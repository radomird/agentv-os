# Earlier versions let the owner use sudo without a password for as long as
# an update from the TV ran, and once for first boot's splash, with a rule
# of AgenTV's own in /etc/sudoers.d. Nothing writes one any more
# (bin/agentv-update-tv, install/tv/branding.sh). A box that lost power
# halfway through one of those, on a version before this, may still have the
# rule, and this takes it away at boot.
r! /etc/sudoers.d/99-agentv-update-*
r! /etc/sudoers.d/99-agentv-branding-*
