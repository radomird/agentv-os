# The builder (ADR-011, ADR-045): origaitv-builder runs each build in its
# sandbox, and origaitv-build-net is its way out, the filter and the key
# relay. The builder's in that one's group, which is how it reaches them.
u origaitv-builder - "OrigaiTV builder" /var/lib/origaitv/builder /usr/bin/nologin
u origaitv-build-net - "OrigaiTV builder's way out" - /usr/bin/nologin
m origaitv-builder origaitv-build-net
# The other way round too: the way out reads the running build's state for
# its filter, and the nightly package check reads the builds' lockfiles. A
# build's folder is the builder's and its group's, and no one else's. The
# builder's home stays its own (0700), whoever is in its group.
m origaitv-build-net origaitv-builder
