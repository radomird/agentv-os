# The builder (ADR-011, ADR-045): agentv-builder runs each build in its
# sandbox, and agentv-build-net is its way out, the filter and the key
# relay. The builder's in that one's group, which is how it reaches them.
u agentv-builder - "AgenTV builder" /var/lib/agentv/builder /usr/bin/nologin
u agentv-build-net - "AgenTV builder's way out" - /usr/bin/nologin
m agentv-builder agentv-build-net
